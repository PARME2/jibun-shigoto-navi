<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ジブン×シゴト ナビ（デモ版）</title>
<style>
:root {
  --primary: #0D9488;
  --primary-light: #ccfbf1;
  --primary-dark: #0f766e;
  --accent: #f59e0b;
  --accent-light: #fef3c7;
  --teal: #5cdccf;
  --teal-light: #e8faf8;
  --blue: #30b6fe;
  --blue-light: #eaf6ff;
  --orange: #fdb12e;
  --orange-light: #fff8eb;
  --yellow: #f0ff00;
  --purple: #c65de3;
  --success: #5cdccf;
  --success-light: #e8faf8;
  --danger: #ef4444;
  --danger-light: #fee2e2;
  --bg: #f6f5f2;
  --card: #ffffff;
  --text: #0f172a;
  --text-mid: #575554;
  --text-sub: #968c87;
  --border: #e0dfd3;
  --radius: 20px;
  --radius-sm: 10px;
  --radius-pill: 30px;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif;
  background: #efefe9; color: var(--text);
  min-height: 100vh; display: flex; justify-content: center;
  font-size: 16px;
}
.app { width: 100%; max-width: 430px; min-height: 100vh; background: var(--bg); position: relative; overflow-x: hidden; }
.header { background: var(--bg); color: var(--text); padding: 14px 20px; position: sticky; top: 0; z-index: 100; }
.header h1 { font-size: 18px; font-weight: 800; letter-spacing: 0.5px; color: var(--primary); }
.header .subtitle { font-size: 11px; color: var(--text-sub); margin-top: 2px; }
/* ===== Progress ===== */
.progress-wrap { background: var(--border); height: 6px; border-radius: 3px; margin-top: 12px; overflow: hidden; }
.progress-bar { height: 100%; background: var(--teal); border-radius: 3px; transition: width 0.4s ease; }

/* ===== Screens ===== */
.screen { display: none; padding: 24px 20px 40px; animation: screenIn 0.3s ease; }
.screen.active { display: block; }
@keyframes screenIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

/* ===== Welcome ===== */
.welcome-hero { text-align: center; padding: 40px 16px 32px; }
.welcome-hero .icon { font-size: 56px; margin-bottom: 14px; }
.welcome-hero h2 { font-size: 24px; font-weight: 800; margin-bottom: 10px; line-height: 1.4; }
.welcome-hero p { font-size: 15px; color: var(--text-mid); line-height: 1.7; }
.step-list { background: var(--card); border-radius: var(--radius); padding: 20px; margin: 0 0 24px; border: 2px solid var(--border); }
.step-item { display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; }
.step-item + .step-item { border-top: 1px solid var(--border); }
.step-num { width: 32px; height: 32px; background: var(--primary); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; flex-shrink: 0; }
.step-item .label { font-size: 16px; font-weight: 800; }
.step-item .desc { font-size: 13px; color: var(--text-sub); margin-top: 3px; line-height: 1.5; }
.info-note { background: var(--orange-light); border-radius: var(--radius-sm); padding: 14px 16px; margin: 0 0 24px; font-size: 14px; color: #92400e; line-height: 1.6; font-weight: 600; border-left: 4px solid var(--orange); }

/* ===== Buttons ===== */
.btn { display: block; width: 100%; padding: 17px; border: none; border-radius: var(--radius-pill); font-size: 16px; font-weight: 800; cursor: pointer; transition: all 0.2s; text-align: center; position: relative; overflow: hidden; }
.btn::after { content: ''; position: absolute; inset: 0; background: rgba(255,255,255,0); transition: background 0.2s; }
.btn:active::after { background: rgba(255,255,255,0.2); }
.btn:active { transform: scale(0.97); }
.btn-primary { background: linear-gradient(135deg, var(--primary), #30b6fe); color: #fff; }
.btn-accent { background: linear-gradient(135deg, var(--accent), #fdb12e); color: #fff; }
.btn-outline { background: var(--card); color: var(--primary); border: 2.5px solid var(--primary); }
.btn-outline:active { background: var(--primary-light); }
.btn + .btn { margin-top: 12px; }

/* ===== Questions ===== */
.episode-label { text-align: center; padding: 12px 16px; font-size: 14px; color: var(--text); font-weight: 800; background: var(--card); border-radius: var(--radius-pill); margin-bottom: 20px; border: 2px solid var(--border); }
.question-card { background: var(--card); border-radius: var(--radius); padding: 24px 20px; margin-bottom: 16px; border: 2px solid var(--border); }
.q-number { font-size: 13px; color: var(--teal); font-weight: 800; margin-bottom: 10px; }
.q-context { font-size: 13px; color: var(--text-mid); background: var(--primary-light); padding: 10px 14px; border-radius: var(--radius-sm); margin-bottom: 14px; line-height: 1.6; }
.q-text { font-size: 18px; font-weight: 800; line-height: 1.5; margin-bottom: 20px; }
.choices { display: flex; flex-direction: column; gap: 12px; }
.choice { padding: 16px 18px; border: 2.5px solid var(--border); border-radius: var(--radius); font-size: 15px; line-height: 1.5; cursor: pointer; transition: all 0.2s; background: var(--card); text-align: left; font-weight: 500; min-height: 54px; display: flex; align-items: center; }
.choice:active { transform: scale(0.97); box-shadow: 0 0 0 4px rgba(93,220,207,0.2); }
.choice.selected { border-color: var(--teal); background: var(--teal-light); font-weight: 700; }

/* ===== Value Cards ===== */
.value-cards-section { text-align: center; padding-top: 20px; }
.value-cards-section h2 { font-size: 22px; font-weight: 800; margin-bottom: 24px; }
.value-card { border-radius: var(--radius); padding: 0; margin-bottom: 20px; text-align: left; overflow: hidden; animation: slideUp 0.5s ease forwards; opacity: 0; }
.value-card:nth-child(2) { animation-delay: 0.2s; }
.value-card:nth-child(3) { animation-delay: 0.4s; }
@keyframes slideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
.vc-header { padding: 20px 20px 16px; color: #fff; position: relative; overflow: hidden; }
.vc-header::before { content: ''; position: absolute; top: -30px; right: -30px; width: 100px; height: 100px; border-radius: 50%; background: rgba(255,255,255,0.1); }
.vc-header::after { content: ''; position: absolute; bottom: -20px; left: -20px; width: 70px; height: 70px; border-radius: 50%; background: rgba(255,255,255,0.08); }
.value-card:nth-child(1) .vc-header { background: linear-gradient(135deg, #0D9488, #14b8a6); }
.value-card:nth-child(2) .vc-header { background: linear-gradient(135deg, #2563eb, #30b6fe); }
.value-card:nth-child(3) .vc-header { background: linear-gradient(135deg, #ea580c, #fdb12e); }
.vc-rank { font-size: 13px; font-weight: 800; opacity: 0.8; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.vc-title-row { display: flex; align-items: center; gap: 12px; }
.vc-icon { width: 48px; height: 48px; background: rgba(255,255,255,0.2); border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.vc-icon i { width: 26px; height: 26px; color: #fff; }
.value-card .title { font-size: 24px; font-weight: 900; color: #fff; line-height: 1.2; }
.vc-body { padding: 16px 20px 20px; background: var(--card); border: 2px solid var(--border); border-top: none; border-radius: 0 0 var(--radius) var(--radius); }
.value-card .reason { font-size: 14px; color: var(--text-mid); line-height: 1.7; margin-bottom: 8px; }
.value-card .subtype { font-size: 13px; font-weight: 800; margin-bottom: 10px; padding: 8px 14px; border-radius: var(--radius-sm); display: inline-block; }
.value-card:nth-child(1) .subtype { background: var(--teal-light); color: var(--teal); }
.value-card:nth-child(2) .subtype { background: var(--blue-light); color: var(--blue); }
.value-card:nth-child(3) .subtype { background: var(--orange-light); color: var(--orange); }
.value-card .evidence { font-size: 13px; line-height: 1.6; background: var(--bg); border-radius: var(--radius-sm); padding: 12px 14px; border: 1px solid var(--border); }
.value-card .evidence-label { font-size: 11px; font-weight: 800; color: var(--text-sub); margin-bottom: 6px; letter-spacing: 0.5px; }

/* ===== Profile ===== */
.profile-hero { text-align: center; padding: 24px 0 16px; }
.profile-hero-title { font-size: 22px; font-weight: 900; margin-bottom: 4px; }
.profile-hero-sub { font-size: 13px; color: var(--text-sub); }
.profile-type-cards { margin-bottom: 20px; }
.profile-type-card { border-radius: var(--radius); overflow: hidden; margin-bottom: 14px; }
.ptc-header { padding: 16px; color: #fff; display: flex; align-items: center; gap: 12px; position: relative; overflow: hidden; }
.ptc-header::before { content: ''; position: absolute; top: -20px; right: -20px; width: 80px; height: 80px; border-radius: 50%; background: rgba(255,255,255,0.1); }
.ptc-rank { font-size: 12px; font-weight: 800; opacity: 0.8; position: absolute; top: 10px; right: 14px; }
.ptc-icon { width: 40px; height: 40px; background: rgba(255,255,255,0.2); border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.ptc-icon i { width: 22px; height: 22px; color: #fff; }
.ptc-name { font-size: 18px; font-weight: 900; }
.ptc-body { padding: 14px 16px; background: var(--card); border: 2px solid var(--border); border-top: none; border-radius: 0 0 var(--radius) var(--radius); }
.ptc-desc { font-size: 13px; color: var(--text-mid); line-height: 1.6; margin-bottom: 8px; }
.ptc-subtype { font-size: 12px; font-weight: 800; padding: 6px 12px; border-radius: var(--radius-pill); display: inline-block; margin-bottom: 8px; }
.ptc-evidence { font-size: 12px; color: var(--text-sub); line-height: 1.5; background: var(--bg); border-radius: var(--radius-sm); padding: 10px 12px; }
.ptc-evidence strong { color: var(--text); font-weight: 700; }
.profile-section { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; border: 2px solid var(--border); }
.profile-section-title { font-size: 14px; font-weight: 800; margin-bottom: 10px; color: var(--text); }
.profile-stats { display: flex; gap: 10px; margin-bottom: 14px; }
.profile-stat { flex: 1; background: var(--card); border: 2px solid var(--border); border-radius: var(--radius); padding: 14px; text-align: center; }
.profile-stat-num { font-size: 28px; font-weight: 900; color: var(--primary); line-height: 1; }
.profile-stat-label { font-size: 11px; color: var(--text-sub); margin-top: 4px; font-weight: 700; }
.work-style-tag { display: inline-block; padding: 8px 14px; border-radius: var(--radius-pill); font-size: 12px; font-weight: 800; margin: 0 6px 8px 0; background: var(--primary-light); color: var(--primary); }

/* ===== Booth cards (all companies / challenge) ===== */
.booth-card { background: var(--card); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; transition: all 0.3s; border: 2px solid var(--border); }
.booth-card:active { border-color: var(--teal); }
.booth-header { padding: 16px; cursor: pointer; display: flex; align-items: flex-start; gap: 12px; }
.booth-info { flex: 1; min-width: 0; }
.booth-name { font-size: 15px; font-weight: 800; margin-bottom: 4px; }
.booth-industry { font-size: 11px; color: #fff; display: inline-block; padding: 3px 10px; border-radius: var(--radius-pill); margin-bottom: 6px; font-weight: 700; background: var(--teal); }
.booth-connection { font-size: 13px; color: var(--text-mid); font-weight: 600; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.booth-right { display: flex; flex-direction: column; align-items: center; gap: 8px; flex-shrink: 0; }
.booth-arrow { color: var(--text-sub); transition: transform 0.3s; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; }
.booth-card.open .booth-arrow { transform: rotate(180deg); }
.booth-detail { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
.booth-card.open .booth-detail { max-height: none; }
.booth-detail-inner { padding: 4px 16px 16px; border-top: 2px solid var(--border); }
.detail-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
.detail-item:last-child { border-bottom: none; }
.detail-label { font-size: 11px; color: var(--text-sub); font-weight: 800; margin-bottom: 6px; letter-spacing: 0.5px; text-transform: uppercase; }
.detail-text { font-size: 14px; line-height: 1.7; color: var(--text-mid); }
.detail-evidence { background: var(--teal-light); border-radius: var(--radius-sm); padding: 10px 14px; margin-top: 8px; font-size: 13px; line-height: 1.6; }
.detail-evidence-user { color: var(--text-sub); }
.detail-evidence-company { color: var(--primary); font-weight: 700; }
.value-match-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.value-match-tag { font-size: 11px; padding: 4px 12px; border-radius: var(--radius-pill); font-weight: 800; color: #fff; }
.vt-1 { background: var(--teal); }
.vt-2 { background: var(--blue); }
.vt-3 { background: var(--orange); }

/* ===== Visit / Challenge ===== */
.visit-goal { background: var(--primary-light); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; text-align: center; }
.visit-goal .goal-text { font-size: 17px; font-weight: 800; margin-bottom: 12px; color: var(--text); }
.visit-progress-bar { background: var(--border); height: 12px; border-radius: 6px; overflow: hidden; margin-bottom: 8px; }
.visit-progress-fill { height: 100%; background: var(--teal); border-radius: 6px; transition: width 0.4s ease; }
.visit-progress-text { font-size: 14px; color: var(--text-sub); font-weight: 600; }
.visit-progress-text strong { color: var(--primary); font-size: 16px; }
.visit-card { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 10px; border: 2px solid var(--border); transition: border-color 0.2s; }
.visit-card.visited { border-color: var(--teal); }
.visit-header { display: flex; align-items: center; gap: 12px; }
.visit-check { width: 36px; height: 36px; border: 2.5px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; font-size: 20px; }
.visit-check.checked { background: var(--teal); border-color: var(--teal); color: #fff; }
.visit-check:active { transform: scale(0.85); }
.visit-name { font-size: 15px; font-weight: 800; flex: 1; }
.visit-reason { font-size: 12px; color: var(--text-sub); margin-top: 4px; }
.visit-memo { width: 100%; border: 2px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 14px; resize: none; height: 56px; font-family: inherit; margin-top: 10px; display: none; transition: border-color 0.2s; }
.visit-card.visited .visit-memo { display: block; }
.visit-memo:focus { outline: none; border-color: var(--teal); }

/* ===== Profile icon ===== */
.profile-icon { width: 40px; height: 40px; border-radius: 50%; background: var(--primary-light); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; }
.profile-icon:active { opacity: 0.7; transform: scale(0.9); }
.profile-icon svg { width: 22px; height: 22px; fill: var(--primary); }
.profile-icon.hidden { display: none; }

/* ===== Top tabs ===== */
.top-tabs { display: flex; background: var(--bg); position: sticky; top: 49px; z-index: 99; padding: 0 4px; border-bottom: 1px solid var(--border); }
.top-tabs.hidden { display: none; }
.tab-item { flex: 1; padding: 12px 4px 10px; text-align: center; cursor: pointer; font-size: 12px; font-weight: 800; color: var(--text-sub); border: none; background: none; font-family: inherit; border-bottom: 3px solid transparent; transition: all 0.2s; }
.tab-item.active { color: var(--primary); border-bottom-color: var(--primary); }
.tab-item svg, .tab-item i { width: 15px; height: 15px; vertical-align: -3px; margin-right: 3px; }

/* ===== Horizontal scroll / Summary cards ===== */
.hscroll-row { display: flex; overflow-x: auto; gap: 16px; padding: 12px 4px 16px; -webkit-overflow-scrolling: touch; scroll-snap-type: x mandatory; }
.hscroll-row::-webkit-scrollbar { display: none; }
.summary-card { width: 80vw; max-width: 320px; background: var(--card); border-radius: var(--radius); border: 2px solid var(--border); padding: 0; cursor: pointer; transition: all 0.2s; scroll-snap-align: center; flex-shrink: 0; display: flex; flex-direction: column; overflow: hidden; }
.summary-card:active { transform: scale(0.97); border-color: var(--teal); }
.sc-img { width: 100%; height: 140px; background: linear-gradient(135deg, #e0dfd3, #ccc); display: flex; align-items: center; justify-content: center; color: var(--text-sub); font-size: 40px; position: relative; }
.sc-img img { width: 100%; height: 100%; object-fit: cover; }
.sc-img .sc-booth-float { position: absolute; top: 10px; left: 10px; background: rgba(13,148,136,0.9); color: #fff; font-size: 13px; font-weight: 900; padding: 4px 10px; border-radius: var(--radius-sm); backdrop-filter: blur(4px); }
.sc-body { padding: 16px; flex: 1; display: flex; flex-direction: column; gap: 10px; }
.sc-name { font-size: 16px; font-weight: 800; line-height: 1.3; }
.sc-work { font-size: 14px; font-weight: 800; color: var(--primary); line-height: 1.4; }
.sc-pr { font-size: 13px; line-height: 1.6; color: var(--text-mid); }
.sc-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
.sc-tag { font-size: 10px; padding: 4px 10px; border-radius: var(--radius-pill); font-weight: 800; color: #fff; }
.sc-tag-industry { background: var(--teal); }
.sc-tag-type { background: var(--blue); }
.sc-tag-local { background: var(--orange); }
.sc-footer { padding: 12px 16px; border-top: 2px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.sc-detail-hint { font-size: 12px; color: var(--text-sub); font-weight: 600; }
.sc-plan-btn { padding: 8px 16px; border: 2px solid var(--primary); border-radius: var(--radius-pill); font-size: 13px; font-weight: 800; cursor: pointer; background: transparent; color: var(--primary); transition: all 0.2s; white-space: nowrap; font-family: inherit; }
.sc-plan-btn:active { background: var(--primary); color: #fff; }
.sc-plan-btn.done { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ===== Back button ===== */
.back-btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; border: none; background: none; font-size: 15px; font-weight: 800; color: var(--primary); cursor: pointer; font-family: inherit; margin-bottom: 8px; }
.back-btn:active { opacity: 0.6; }

/* ===== Filter chips ===== */
.filter-row { display: flex; overflow-x: auto; gap: 8px; margin-bottom: 20px; padding: 4px 0; -webkit-overflow-scrolling: touch; }
.filter-row::-webkit-scrollbar { display: none; }
.filter-chip { padding: 8px 16px; border: 2px solid var(--border); border-radius: var(--radius-pill); font-size: 13px; font-weight: 800; cursor: pointer; background: var(--card); color: var(--text-sub); transition: all 0.2s; white-space: nowrap; flex-shrink: 0; }
.filter-chip.active { border-color: var(--primary); background: var(--primary); color: #fff; }
.filter-chip.planned-filter { border-color: var(--accent); color: var(--accent); }
.filter-chip.planned-filter.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.filter-chip:active { transform: scale(0.95); }
.all-company-count { font-size: 13px; color: var(--text-sub); margin-bottom: 12px; font-weight: 600; }

/* ===== Booth badge ===== */
.booth-badge { display: inline-block; padding: 3px 8px; border-radius: var(--radius-sm); font-size: 11px; font-weight: 900; background: var(--primary); color: #fff; letter-spacing: 0.5px; white-space: nowrap; flex-shrink: 0; }

/* ===== Section titles ===== */
.section-title { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
.section-sub { font-size: 14px; color: var(--text-sub); margin-bottom: 20px; }
.industry-section { margin-bottom: 24px; }
.industry-section-label { font-size: 15px; font-weight: 800; color: var(--text); padding: 10px 0 4px; border-bottom: 2px solid var(--teal); margin-bottom: 4px; display: inline-block; }
/* Booth map */
.map-container { background: #1a1a2e; border-radius: var(--radius); padding: 16px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.map-title { color: #e0e0e0; font-size: 11px; font-weight: 600; text-align: center; margin-bottom: 12px; letter-spacing: 2px; text-transform: uppercase; }
.map-legend { display: flex; gap: 14px; margin-bottom: 16px; font-size: 12px; font-weight: 600; justify-content: center; }
.legend-item { display: flex; align-items: center; gap: 5px; color: var(--text-sub); }
.legend-dot { width: 12px; height: 12px; border-radius: 3px; }
.legend-dot.planned { background: var(--blue); }
.legend-dot.visited { background: var(--teal); }
.legend-dot.default { background: #334155; }
.map-area { margin-bottom: 16px; position: relative; }
.map-area-label { font-size: 11px; font-weight: 700; color: #94a3b8; margin-bottom: 6px; padding-left: 2px; letter-spacing: 1px; }
.map-grid { display: grid; gap: 4px; min-width: fit-content; }
.map-grid.main { grid-template-columns: repeat(7, 52px); }
.map-grid.sub { grid-template-columns: repeat(5, 52px); }
.map-cell { width: 52px; min-height: 52px; border-radius: 6px; padding: 4px 2px; text-align: center; cursor: pointer; transition: all 0.15s; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 2px solid transparent; position: relative; }
.map-cell.empty { visibility: hidden; }
.map-cell.default { background: #1e293b; border-color: #334155; }
.map-cell.planned { background: #172554; border-color: var(--blue); box-shadow: 0 0 8px rgba(48,182,254,0.3); }
.map-cell.visited { background: #134e4a; border-color: var(--teal); box-shadow: 0 0 8px rgba(93,220,207,0.3); }
.map-cell:active { transform: scale(0.92); }
.map-cell .mc-num { font-size: 14px; font-weight: 800; }
.map-cell.default .mc-num { color: #64748b; }
.map-cell.planned .mc-num { color: var(--blue); }

<script>
// ===== Supabase 初期化 =====
var SUPABASE_URL = 'https://your-project.supabase.co';
var SUPABASE_KEY = 'your-anon-key';
var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
var currentUserId = null;

// ユーザーID管理（LocalStorage + Supabase）
async function initUser() {
  var storedId = localStorage.getItem('jibun_navi_user_id');
  if (storedId) {
    // 既存ユーザーの確認
    var { data } = await sb.from('users').select('*').eq('id', storedId).single();
    if (data) {
      currentUserId = data.id;
      return data;
    }
  }
  // 新規ユーザー作成
  var { data, error } = await sb.from('users').insert({}).select().single();
  if (error) { console.error('User create error:', error); return null; }
  currentUserId = data.id;
  localStorage.setItem('jibun_navi_user_id', data.id);
  return data;
}

// 回答を保存
async function saveAnswer(questionNum, choiceData) {
  if (!currentUserId) return;
  await sb.from('answers').upsert({
    user_id: currentUserId,
    question_num: questionNum,
    choice_index: choiceData.choiceIndex,
    choice_short: choiceData.short,
    tags: choiceData.tags || [],
    axis: choiceData.axis || null,
    branch: choiceData.branch || null,
    subtype: choiceData.subtype || null,
    role: choiceData.role || null
  }, { onConflict: 'user_id,question_num' });
  // 進捗更新
  await sb.from('users').update({ current_question: questionNum + 1 }).eq('id', currentUserId);
}

// 結果を保存
async function saveResults() {
  if (!currentUserId) return;
  await sb.from('results').upsert({
    user_id: currentUserId,
    top_branches: topBranches,
    subtype_text: subtypeText,
    local_flag: LOCAL_FLAG,
    branch_counts: branchCounts
  }, { onConflict: 'user_id' });
  await sb.from('users').update({ completed: true }).eq('id', currentUserId);
}

// いく予定を保存
async function savePlannedVisit(companyId) {
  if (!currentUserId) return;
  await sb.from('planned_visits').upsert({
    user_id: currentUserId,
    company_id: companyId
  }, { onConflict: 'user_id,company_id' });
}

// いく予定を削除
async function removePlannedVisit(companyId) {
  if (!currentUserId) return;
  await sb.from('planned_visits').delete()
    .eq('user_id', currentUserId).eq('company_id', companyId);
}

// 実訪問を保存
async function saveActualVisit(companyId, visited, memo) {
  if (!currentUserId) return;
  if (visited) {
    await sb.from('actual_visits').upsert({
      user_id: currentUserId,
      company_id: companyId,
      memo: memo || ''
    }, { onConflict: 'user_id,company_id' });
  } else {
    await sb.from('actual_visits').delete()
      .eq('user_id', currentUserId).eq('company_id', companyId);
  }
}

// 業種選択を保存（LocalStorageのみ）
function saveIndustrySelection() {
  localStorage.setItem('jibun_navi_industries', JSON.stringify(selectedIndustries));
}
function loadIndustrySelection() {
  var stored = localStorage.getItem('jibun_navi_industries');
  if (stored) { try { selectedIndustries = JSON.parse(stored); } catch(e){} }
}

// 中断データの復元
async function restoreSession() {
  if (!currentUserId) return false;

  // 回答を復元
  var { data: savedAnswers } = await sb.from('answers')
    .select('*').eq('user_id', currentUserId).order('question_num');
  if (!savedAnswers || savedAnswers.length === 0) return false;

  // answersとスコアを再構築
  savedAnswers.forEach(function(sa) {
    var idx = sa.question_num;
    answers[idx] = {
      text: '', short: sa.choice_short || '',
      tags: sa.tags || [], axis: sa.axis || null,
      branch: sa.branch || null, subtype: sa.subtype || null,
      role: sa.role || null, choiceIndex: sa.choice_index
    };
    // スコア再計算: actionのみ+1
    if (sa.role === 'action') {
      (sa.tags || []).forEach(function(t) {
        if (branchCounts.hasOwnProperty(t)) branchCounts[t] = (branchCounts[t] || 0) + 1;
      });
    }
    if (sa.role === 'scene' && sa.tags && sa.tags.indexOf('local') !== -1) LOCAL_FLAG = true;
  });

  // 結果を復元
  var { data: savedResult } = await sb.from('results')
    .select('*').eq('user_id', currentUserId).single();
  if (savedResult) {
    topBranches = savedResult.top_branches || [];
    subtypeText = savedResult.subtype_text || '';
    LOCAL_FLAG = savedResult.local_flag || false;
    if (savedResult.branch_counts) branchCounts = savedResult.branch_counts;
  }

  // いく予定を復元
  var { data: savedPlanned } = await sb.from('planned_visits')
    .select('company_id').eq('user_id', currentUserId);
  if (savedPlanned) {
    savedPlanned.forEach(function(p) { plannedCompanies[p.company_id] = true; });
  }

  // 実訪問を復元
  var { data: savedVisits } = await sb.from('actual_visits')
    .select('*').eq('user_id', currentUserId);
  if (savedVisits) {
    savedVisits.forEach(function(v) {
      visitStatus[v.company_id] = true;
      if (v.memo) visitStatus[v.company_id + '_memo'] = v.memo;
    });
  }

  // 業種選択を復元
  loadIndustrySelection();

  return true;
}

function hideScreen(id) { document.getElementById(id).classList.remove('active'); }
function showScreen(id) { document.getElementById(id).classList.add('active','fade-in'); window.scrollTo(0,0); }
function hideAllScreens() { document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); }); }
function updateProgress(step) { document.getElementById('progressBar').style.width = (step/totalQuestions*100)+'%'; }

function renderQuestion(idx) {
  updateProgress(idx);
  var q = allQuestions[idx];

  // Q2/Q6: contextにQ1/Q5の回答を動的引用
  var contextText = q.context;
  if (q.contextTemplate) {
    var sceneIdx = (idx < 4) ? 0 : 4;
    if (answers[sceneIdx]) {
      contextText = q.contextTemplate.replace('{scene}', answers[sceneIdx].short);
    }
  }

  var html = '<div class="question-card">';
  html += '<div class="q-text">'+q.text+'</div>';
  html += '<div class="choices">';
  q.choices.forEach(function(c,i){
    html += '<div class="choice" onclick="selectChoice('+idx+','+i+')" id="choice_'+idx+'_'+i+'">'+c.text+'</div>';
  });
  html += '</div></div>';
  document.getElementById('questionContainer').innerHTML = html;
  window.scrollTo(0,0);
}

function selectChoice(qIdx, cIdx) {
  var q = allQuestions[qIdx];
  var choice = q.choices[cIdx];
  document.querySelectorAll('.choice').forEach(function(el){ el.classList.remove('selected'); });
  document.getElementById('choice_'+qIdx+'_'+cIdx).classList.add('selected');

  answers[qIdx] = {
    text: choice.text, short: choice.short || choice.text,
    tags: choice.tags, axis: choice.axis || null,
    branch: choice.branch || null, subtype: choice.subtype || null,
    role: q.role, choiceIndex: cIdx
  };

  // Supabaseに保存
  saveAnswer(qIdx, answers[qIdx]);

  if (choice.localFlag) LOCAL_FLAG = true;

  // スコアリング: actionのみ+1（scene/difficultyはスコアなし）
  if (q.role === 'action') {
    (choice.tags || []).forEach(function(t) {
      if (branchCounts.hasOwnProperty(t)) {
        branchCounts[t] = (branchCounts[t] || 0) + 1;
      }
    });
  }

  setTimeout(function(){
    if (qIdx === 2) {
      // エピソード1完了→そのまま次へ
      renderQuestion(3);
    } else if (qIdx === 5) {
      // エピソード2完了（Q4場面→Q5困難→Q6行動）→ 深掘りQ7を生成
      generateDeepDive();
      renderQuestion(6);
    } else if (qIdx === 6) {
      // Q7（深掘り）完了 → 判定
      updateProgress(totalQuestions);
      calculateFinal();
    } else {
      renderQuestion(qIdx + 1);
    }
  }, 400);
}

function calculateFinal() {

  topBranches = sorted.slice(0,3);

  if (q7 && q7.subtype) subtypeText = q7.subtype;
  // Supabaseに結果を保存
  saveResults();
  showValueCards();
}

// scene + action の2文セットで引用を構築
function getEvidenceForBranch(branchKey) {
  var ev = [];
  // [action_idx, scene_idx] のペア
  var pairs = [[2, 0], [5, 3]];
  pairs.forEach(function(pair) {
    var actionA = answers[pair[0]];
    var sceneA = answers[pair[1]];
    if (!actionA) return;
    if (actionA.tags && actionA.tags.indexOf(branchKey) !== -1) {
      ev.push({
        text: actionA.text, short: actionA.short,
        sceneShort: sceneA ? sceneA.short : '',
        combined: (sceneA ? sceneA.short + ' → ' : '') + actionA.short
      });
    }
  });
  // フォールバック: actionだけでなくscene/difficulty含め全回答からタグ一致を探す
  if (ev.length === 0) {
    // まずscene+actionペアでsceneタグから引用
    var scenePairs = [[0, 2], [3, 5]];
    scenePairs.forEach(function(pair) {
      var sceneA = answers[pair[0]];
      var actionA = answers[pair[1]];
      if (!sceneA || !sceneA.tags) return;
      if (sceneA.tags.indexOf(branchKey) !== -1) {
        ev.push({
          text: sceneA.text, short: sceneA.short, sceneShort: '',
          combined: sceneA.short + (actionA ? ' → ' + actionA.short : '')
        });
      }
    });
  }
  if (ev.length === 0) {
    answers.forEach(function(a) {
      if (!a || !a.tags) return;
      if (a.tags.indexOf(branchKey) !== -1) {
        ev.push({ text: a.text, short: a.short, sceneShort: '', combined: a.short });
      }
    });
  }
  return ev;
}

function calculateAllCompanies() {
  displayCompanies = COMPANIES.map(function(c){
    var matchedValues = [];
    var score = 0;
    topBranches.forEach(function(val, idx){
      if(c.valueTags.indexOf(val) !== -1){ matchedValues.push(val); score += (3 - idx); }
    });
    if(LOCAL_FLAG && c.localTag) score += 1;
    return { company: c, matchedValues: matchedValues, score: score };
  });
}

  selKeys.forEach(function(ind) {
    var items = displayCompanies.filter(function(item){
      return item.company.industry === ind && !plannedCompanies[item.company.id];
    });
    items.sort(function(a,b){ return b.score - a.score; });
    var top5 = items.slice(0, 5);
    if (top5.length > 0) groups[ind] = top5;
  });

  var groupKeys = Object.keys(groups);

  // フィルタチップ（アンカーリンク）
  var html = '<div class="filter-row" id="boothFilterRow">';
  groupKeys.forEach(function(ind, i) {
    html += '<div class="filter-chip" onclick="scrollToIndustry('+i+')">'+ind+'（'+groups[ind].length+'）</div>';
  });
  html += '</div>';

  // 業種ごとのセクション + 横スクロール
  groupKeys.forEach(function(ind, i) {
    html += '<div class="industry-section" id="ind_'+i+'">';
    html += '<div class="industry-section-label">'+ind+'</div>';
    html += '<div class="hscroll-row">';
    groups[ind].forEach(function(item){ html += renderSummaryCard(item); });
    html += '</div></div>';
  });

  if (groupKeys.length === 0) {
    html += '<div style="text-align:center;padding:40px;color:var(--text-sub);">すべての企業を「いく予定」に追加しました！</div>';
  }

  document.getElementById('boothListContainer').innerHTML = html;
}

function scrollToIndustry(idx) {
  var el = document.getElementById('ind_'+idx);
  if (!el) return;
  var headerH = document.querySelector('.header') ? document.querySelector('.header').offsetHeight : 0;
  var tabsH = document.querySelector('.top-tabs:not(.hidden)') ? document.querySelector('.top-tabs:not(.hidden)').offsetHeight : 0;
  var offset = headerH + tabsH + 16;
  var rect = el.getBoundingClientRect();
  var scrollTop = window.pageYOffset || document.documentElement.scrollTop;
  window.scrollTo({ top: rect.top + scrollTop - offset, behavior: 'smooth' });
}

// 「聞いてみよう」を生成
function getAskSuggestions(company) {
  var asks = [];
  var tags = company.valueTags.slice();
  if (company.localTag && LOCAL_FLAG) tags.push('local');
  // ユーザーのtopBranchesとの共通タグから優先
  topBranches.forEach(function(tb){
    if (tags.indexOf(tb) !== -1 && ASK_TEMPLATES[tb]) {
      ASK_TEMPLATES[tb].forEach(function(q){ if(asks.indexOf(q)===-1) asks.push(q); });
    }
  });
  // localも
  if (company.localTag && LOCAL_FLAG && ASK_TEMPLATES.local) {
    ASK_TEMPLATES.local.forEach(function(q){ if(asks.indexOf(q)===-1) asks.push(q); });
  }
  // 足りなければ企業のタグから
  tags.forEach(function(t){
    if (ASK_TEMPLATES[t]) ASK_TEMPLATES[t].forEach(function(q){ if(asks.indexOf(q)===-1) asks.push(q); });
  });
  return asks.slice(0, 3);
}

function renderBoothMap() {
  // 進捗バー
  var visitedCount = getVisitedCount();
  var target = Math.max(VISIT_GOAL, Object.keys(plannedCompanies).filter(function(k){ return plannedCompanies[k]; }).length);
  var pct = target > 0 ? Math.round((visitedCount / target) * 100) : 0;
  if (pct > 100) pct = 100;
  var goalHtml = '<div class="visit-goal">';
  goalHtml += '<div class="goal-text"><i data-lucide="target" style="width:16px;height:16px;vertical-align:-3px;margin-right:3px;"></i> 目標：'+target+'社のブースを回ろう！</div>';
  goalHtml += '<div class="visit-progress-text" style="margin-bottom:8px;"><strong>'+visitedCount+'</strong> / '+target+'社 訪問済';
  if (visitedCount >= target) goalHtml += ' <i data-lucide="party-popper" style="width:16px;height:16px;vertical-align:-3px;"></i> 達成！';
  goalHtml += '</div>';
  goalHtml += '<div class="visit-progress-bar"><div class="visit-progress-fill" style="width:'+pct+'%"></div></div>';
  goalHtml += '</div>';
  document.getElementById('mapGoalContainer').innerHTML = goalHtml;

  // 会社をID→objectでルックアップ
  var byId = {};
  COMPANIES.forEach(function(c){ byId[c.id] = c; });

  function cell(id) {
    var c = byId[id];
    if (!c) return '<div class="map-cell empty"></div>';
    var isPlanned = plannedCompanies[c.id];
    var isVisited = visitStatus[c.id];
    var state = isVisited ? 'visited' : isPlanned ? 'planned' : 'default';
    var shortName = c.name.replace(/株式会社|有限会社|（株）|㈱|株式|会社| |　/g, '').substring(0, 5);
    var showName = (isPlanned || isVisited);
    return '<div class="map-cell '+state+'" onclick="mapCellTap('+c.id+')">'
      + '<div class="mc-num">'+c.id+'</div>'
      + (showName ? '<div class="mc-name">'+shortName+'</div>' : '')
      + '</div>';
  }

  // メインエリア: 7列 × 7行 = 49ブース (1〜47 + 空き)
  // 画像のように左上から番号を配置
  var mainRows = [
    [8, 0, 7, 0, 6, 0, 5],
    [9, 0, 0, 0, 0, 0, 4],
    [10, 0, 0, 0, 0, 0, 3],
    [11, 0, 0, 0, 0, 0, 2],
    [12, 0, 15, 0, 14, 0, 1],
    [13, 0, 0, 0, 0, 0, 0],
  ];

  var subRows = [
  ];

  var html = '<div class="map-container">';
  html += '<div class="map-title">FLOOR MAP</div>';

  // メインエリア
  html += '<div class="map-area">';
  html += '<div class="map-grid" style="grid-template-columns:repeat(7,52px);">';
  mainRows.forEach(function(row) {
    row.forEach(function(id) {
      if (id === 0) html += '<div class="map-cell empty"></div>';
      else html += cell(id);
    });
  });
  html += '</div></div>';

  // 通路
  html += '<div class="map-aisle"></div>';

  // サブエリア
  html += '<div class="map-area">';
  html += '<div class="map-grid" style="grid-template-columns:repeat(5,52px);">';
  subRows.forEach(function(row) {
    row.forEach(function(id) {
      if (id === 0) html += '<div class="map-cell empty"></div>';
      else html += cell(id);
    });
  });
  html += '</div></div>';

  html += '<div class="map-entrance">▲ 入口 ENTRANCE</div>';
  html += '</div>';

  document.getElementById('boothMapContainer').innerHTML = html;
}

function toggleAllFilter(val) {
  if (val === 'planned') {
    allFilterState.planned = !allFilterState.planned;
    if (allFilterState.planned) allFilterState.industry = '';
  } else if (val === 'all') {
    allFilterState.planned = false;
    allFilterState.industry = '';
  } else {
    allFilterState.planned = false;
    allFilterState.industry = (allFilterState.industry === val) ? '' : val;
  }
  renderAllCompanies();
}

function renderAllCompanies() {
  renderAllFilters();

  var filtered = COMPANIES.filter(function(c) {
    if (allFilterState.planned) return plannedCompanies[c.id];
    if (allFilterState.industry) return c.industry === allFilterState.industry;
    return true;
  });

  var html = '';
  if (filtered.length === 0) {
    html = '<div style="text-align:center;padding:40px;color:var(--text-sub);">'
      + (allFilterState.planned ? 'いく予定の企業がありません。おすすめタブから追加しよう！' : '該当する企業がありません')
      + '</div>';
  } else {
    html += '<div class="all-company-count">' + filtered.length + '社 表示中</div>';
    filtered.forEach(function(c) {
      var matchedValues = [];
      if (topBranches.length > 0) {
        topBranches.forEach(function(val){ if(c.valueTags.indexOf(val)!==-1) matchedValues.push(val); });
      }
      html += renderBoothCard({ company: c, matchedValues: matchedValues, score: 0 });
    });
  }
  document.getElementById('allCompaniesContainer').innerHTML = html;
}

function renderVisitList(){

  var totalPlanned = Object.keys(plannedCompanies).filter(function(k){ return plannedCompanies[k]; }).length;
  var target = Math.max(VISIT_GOAL, totalPlanned);
  var pct = target > 0 ? Math.round((visitedCount / target) * 100) : 0;
  if (pct > 100) pct = 100;

  var goalHtml = '<div class="visit-goal">';
  goalHtml += '<div class="goal-text"><i data-lucide="target" style="width:16px;height:16px;vertical-align:-3px;margin-right:3px;"></i> 目標：'+target+'社のブースを回ろう！</div>';
  goalHtml += '<div class="visit-progress-bar"><div class="visit-progress-fill" style="width:'+pct+'%"></div></div>';
  goalHtml += '<div class="visit-progress-text"><strong>'+visitedCount+'社</strong> / '+target+'社';
  if (visitedCount >= target) goalHtml += ' <i data-lucide="party-popper" style="width:16px;height:16px;vertical-align:-3px;"></i> 達成！すごい！';
  else goalHtml += ' — あと'+(target - visitedCount)+'社！';
  goalHtml += '</div></div>';
  document.getElementById('visitGoalContainer').innerHTML = goalHtml;

  // 業種別にグルーピング
  var industries = {};
  COMPANIES.forEach(function(c){
    if (!industries[c.industry]) industries[c.industry] = [];
    industries[c.industry].push(c);
  });

  var html = '';
  Object.keys(industries).forEach(function(ind){
    var companies = industries[ind];
    var visitedInGroup = companies.filter(function(c){ return visitStatus[c.id]; }).length;
    var label = ind + '（' + visitedInGroup + ' / ' + companies.length + '社 訪問済）';

    html += '<div class="industry-group">';
    html += '<div class="industry-group-header" onclick="toggleIndustryGroup(this.parentElement)">';
    html += '<span>' + ind + '<span class="ig-count">　' + visitedInGroup + ' / ' + companies.length + '社</span></span>';
    html += '<span class="ig-arrow"><i data-lucide="chevron-down" style="width:16px;height:16px;"></i></span></div>';
    html += '<div class="industry-group-body">';

    companies.forEach(function(c){
      var checked = visitStatus[c.id] || false;
      var memo = visitStatus[c.id+'_memo'] || '';
      var isPlanned = plannedCompanies[c.id];

      html += '<div class="visit-card'+(checked?' visited':'')+'" style="margin:6px 8px;">';
      html += '<div class="visit-header">';
      html += '<div class="visit-check '+(checked?'checked':'')+'" onclick="toggleVisit('+c.id+')">'+(checked?'<i data-lucide="check" style="width:18px;height:18px;"></i>':'')+'</div>';
      html += '<div style="flex:1;">';
      html += '<div class="visit-name"><span class="booth-badge" style="margin-right:6px;">'+(c.booth||'')+'</span>'+c.name+(isPlanned?' <span style="font-size:10px;color:var(--accent);"><i data-lucide="bookmark" style="width:10px;height:10px;vertical-align:-1px;"></i>予定</span>':'')+'</div>';
      html += '<div class="visit-reason">'+c.jobs.slice(0,2).join('、')+'</div>';
      html += '</div></div>';
      html += '<textarea class="visit-memo" placeholder="感想メモ（例：雰囲気が良かった）" onchange="saveMemo('+c.id+',this.value)">'+memo+'</textarea>';
      html += '</div>';
    });

    html += '</div></div>';
  });
  document.getElementById('visitListContainer').innerHTML=html;
}

function toggleVisit(id){
  visitStatus[id] = !visitStatus[id];
  saveActualVisit(id, visitStatus[id], visitStatus[id+'_memo'] || '');
}

function mapCellTap(id) {
  var c = COMPANIES.find(function(co){ return co.id === id; });
  if (!c) return;
  var isVisited = visitStatus[c.id];
  var matchedValues = [];
  topBranches.forEach(function(val){ if(c.valueTags.indexOf(val)!==-1) matchedValues.push(val); });
  var connectionLine = '';
  if (matchedValues.length > 0) {
    connectionLine = c.matchTexts[matchedValues[0]] || c.pr;
  }

  var html = '';

  // 画像
  if (c.image) {
    html += '<div style="width:100%;height:140px;border-radius:var(--radius-sm);overflow:hidden;margin-bottom:14px;position:relative;">';
    html += '<img src="'+c.image+'" style="width:100%;height:100%;object-fit:cover;">';
    html += '<span style="position:absolute;top:8px;left:8px;background:rgba(13,148,136,0.9);color:#fff;font-size:13px;font-weight:900;padding:4px 10px;border-radius:var(--radius-sm);backdrop-filter:blur(4px);">No.'+(c.booth||c.id)+'</span>';
    html += '</div>';
  }

  // 企業名 + 仕事内容
  html += '<div style="margin-bottom:12px;">';
  html += '<div style="font-size:17px;font-weight:800;margin-bottom:4px;">'+c.name+'</div>';
  if (c.work) html += '<div style="font-size:14px;font-weight:800;color:var(--primary);margin-bottom:6px;">'+c.work+'</div>';
  html += '</div>';

  // PR
  if (c.pr) html += '<div style="font-size:13px;color:var(--text-mid);line-height:1.6;margin-bottom:12px;">'+c.pr+'</div>';

  // タグ
  html += '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;">';
  html += '<span class="sc-tag sc-tag-industry">'+c.industry+'</span>';
  if (matchedValues.length > 0) {
    matchedValues.slice(0,2).forEach(function(val) {
      var b = BRANCHES[val];
      if (b) html += '<span class="sc-tag sc-tag-type">'+branchIcon(b.icon,10)+b.label+'</span>';
    });
  }
  if (LOCAL_FLAG && c.localTag) html += '<span class="sc-tag sc-tag-local"><i data-lucide="map-pin" style="width:10px;height:10px;vertical-align:-1px;margin-right:1px;"></i> 地元</span>';
  html += '</div>';

  // ボタン（縦並び、同じ幅）
  html += '<div style="display:flex;flex-direction:column;gap:10px;">';
  if (isVisited) {
    html += '<button class="btn btn-primary" style="opacity:0.7;" onclick="toggleMapVisit('+c.id+')"><i data-lucide="check" style="width:16px;height:16px;vertical-align:-3px;margin-right:4px;"></i>訪問済み（タップで取消）</button>';
  } else {
    html += '<button class="btn btn-accent" onclick="toggleMapVisit('+c.id+')">訪問済みにする</button>';
  }
  html += '<button class="btn btn-outline" onclick="showCompanyDetail('+c.id+');closeMapPopup();">詳しく見る</button>';
  html += '</div>';

  document.getElementById('mapPopupContent').innerHTML = html;
  document.getElementById('mapPopup').classList.add('active');
  setTimeout(initIcons, 50);
}

function toggleMapVisit(id) {
  visitStatus[id] = !visitStatus[id];
  saveActualVisit(id, visitStatus[id], visitStatus[id+'_memo'] || '');
  closeMapPopup();
  renderBoothMap();
}

function closeMapPopup(e) {
  if (e && e.target !== document.getElementById('mapPopup')) return;
  document.getElementById('mapPopup').classList.remove('active');
}
function saveMemo(id,val){
  visitStatus[id+'_memo']=val;
  if (visitStatus[id]) saveActualVisit(id, true, val);
}
function getVisitedCount(){
  var count=0;
  COMPANIES.forEach(function(c){ if(visitStatus[c.id]) count++; });
  return count;
}

function restartIndustry() {
  if (!confirm('業種選択をやり直しますか？\n（自己分析の結果やいく予定はそのまま残ります）')) return;
  selectedIndustries = {};
  localStorage.removeItem('jibun_navi_industries');
  hideAllScreens();
  goToIndustrySelect();
}

function restartAnalysis() {
  if (!confirm('自己分析を最初からやり直しますか？\n（いく予定や訪問記録はそのまま残ります）')) return;
  answers = [];
  branchCounts = { team:0, support:0, growth:0, stable:0, craft:0, analyze:0 };
  topBranches = [];
  subtypeText = '';
  LOCAL_FLAG = false;
  selectedIndustries = {};
  displayCompanies = [];
  localStorage.removeItem('jibun_navi_industries');
  // Supabase上のデータもクリア（user_idは保持）
  if (currentUserId) {
    sb.from('answers').delete().eq('user_id', currentUserId);
    sb.from('results').delete().eq('user_id', currentUserId);
    sb.from('users').update({ completed: false, current_question: 0 }).eq('id', currentUserId);
  }
  allQuestions = EPISODE_1.concat(EPISODE_2);
  hideAllScreens();
  document.getElementById('topTabs').classList.add('hidden');
  document.getElementById('profileIcon').classList.add('hidden');
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('progressBar').style.width = '0%';
  showScreen('screenQuestions');
  renderQuestion(0);
}

// Lucide icons init - call after any DOM update that adds lucide icons
function initIcons() { if(window.lucide) lucide.createIcons(); }
document.addEventListener('DOMContentLoaded', initIcons);
// Re-init after screen transitions
var _origShowScreen = showScreen;
showScreen = function(id) { _origShowScreen(id); setTimeout(initIcons, 50); };
</script>
</body>
