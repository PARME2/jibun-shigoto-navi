<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ジブン×シゴト ナビ</title>
<style>
:root {
  --primary: #0D9488;
  --primary-light: #ccfbf1;
  --primary-dark: #0f766e;
  --accent: #f59e0b;
  --accent-light: #fef3c7;
  --teal: #5cdccf;
  --teal-light: #e8faf8;
  --blue: #30b6fe;
  --blue-light: #eaf6ff;
  --orange: #fdb12e;
  --orange-light: #fff8eb;
  --yellow: #f0ff00;
  --purple: #c65de3;
  --success: #5cdccf;
  --success-light: #e8faf8;
  --danger: #ef4444;
  --danger-light: #fee2e2;
  --bg: #f6f5f2;
  --card: #ffffff;
  --text: #0f172a;
  --text-mid: #575554;
  --text-sub: #968c87;
  --border: #e0dfd3;
  --radius: 20px;
  --radius-sm: 10px;
  --radius-pill: 30px;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif;
  background: #efefe9; color: var(--text);
  min-height: 100vh; display: flex; justify-content: center;
  font-size: 16px;
}
.app { width: 100%; max-width: 430px; min-height: 100vh; background: var(--bg); position: relative; overflow-x: hidden; }
/* Tablet (768px+) */
@media (min-width: 768px) {
  .app { max-width: 720px; }
  .screen { padding: 32px 40px 48px; }
  .welcome-hero { padding: 60px 20px 40px; }
  .welcome-hero h2 { font-size: 32px; }
  .welcome-hero p { font-size: 17px; }
  .question-card { padding: 32px 28px; }
  .q-text { font-size: 22px; }
  .choice { font-size: 17px; padding: 20px 22px; min-height: 60px; }
  .value-cards-section h2 { font-size: 28px; }
  .vc-header { padding: 24px; }
  .value-card .title { font-size: 28px; }
  .ptc-header { padding: 12px; }
  .ptc-name { font-size: 14px; }
  .ptc-desc { font-size: 13px; }
  .section-title { font-size: 26px; }
  .summary-card { width: 320px; max-width: 360px; }
  .sc-img { aspect-ratio: 4/3; }
  .booth-name { font-size: 17px; }
  .booth-connection { font-size: 14px; }
  .industry-section-label { font-size: 17px; }
  .btn { padding: 20px; font-size: 18px; }
  .header h1 { font-size: 22px; }
  .tab-item { font-size: 14px; padding: 16px 4px 14px; }
}
/* Larger tablet / small desktop (1024px+) */
@media (min-width: 1024px) {
  .app { max-width: 960px; }
  .screen { padding: 40px 60px 56px; }
  .summary-card { width: 340px; }
  .hscroll-row { gap: 20px; }
}
.header { background: var(--bg); color: var(--text); padding: 14px 20px; position: sticky; top: 0; z-index: 100; }
.header h1 { font-size: 18px; font-weight: 800; letter-spacing: 0.5px; color: var(--primary); }
.header .subtitle { font-size: 11px; color: var(--text-sub); margin-top: 2px; }
/* ===== Progress ===== */
.progress-wrap { background: var(--border); height: 6px; border-radius: 3px; margin-top: 12px; overflow: hidden; }
.progress-bar { height: 100%; background: var(--teal); border-radius: 3px; transition: width 0.4s ease; }

/* ===== Screens ===== */
.screen { display: none; padding: 24px 20px 40px; animation: screenIn 0.3s ease; }
.screen.active { display: block; }
@keyframes screenIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

/* ===== Welcome ===== */
.welcome-hero { text-align: center; padding: 40px 16px 32px; }
.welcome-hero .icon { font-size: 56px; margin-bottom: 14px; }
.welcome-hero h2 { font-size: 24px; font-weight: 800; margin-bottom: 10px; line-height: 1.4; }
.welcome-hero p { font-size: 15px; color: var(--text-mid); line-height: 1.7; }
.step-list { background: var(--card); border-radius: var(--radius); padding: 20px; margin: 0 0 24px; border: 2px solid var(--border); }
.step-item { display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; }
.step-item + .step-item { border-top: 1px solid var(--border); }
.step-num { width: 32px; height: 32px; background: var(--primary); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; flex-shrink: 0; }
.step-item .label { font-size: 16px; font-weight: 800; }
.step-item .desc { font-size: 13px; color: var(--text-sub); margin-top: 3px; line-height: 1.5; }
.info-note { background: var(--orange-light); border-radius: var(--radius-sm); padding: 14px 16px; margin: 0 0 24px; font-size: 14px; color: #92400e; line-height: 1.6; font-weight: 600; border-left: 4px solid var(--orange); }

/* ===== Buttons ===== */
.btn { display: block; width: 100%; padding: 17px; border: none; border-radius: var(--radius-pill); font-size: 16px; font-weight: 800; cursor: pointer; transition: all 0.2s; text-align: center; position: relative; overflow: hidden; }
.btn::after { content: ''; position: absolute; inset: 0; background: rgba(255,255,255,0); transition: background 0.2s; }
.btn:active::after { background: rgba(255,255,255,0.2); }
.btn:active { transform: scale(0.97); }
.btn-primary { background: linear-gradient(135deg, var(--primary), #30b6fe); color: #fff; }
.btn-accent { background: linear-gradient(135deg, var(--accent), #fdb12e); color: #fff; }
.btn-outline { background: var(--card); color: var(--primary); border: 2.5px solid var(--primary); }
.btn-outline:active { background: var(--primary-light); }
.btn + .btn { margin-top: 12px; }

/* ===== Questions ===== */
.episode-label { text-align: center; padding: 12px 16px; font-size: 14px; color: var(--text); font-weight: 800; background: var(--card); border-radius: var(--radius-pill); margin-bottom: 20px; border: 2px solid var(--border); }
.question-card { background: var(--card); border-radius: var(--radius); padding: 24px 20px; margin-bottom: 16px; border: 2px solid var(--border); }
.q-number { font-size: 13px; color: var(--teal); font-weight: 800; margin-bottom: 10px; }
.q-context { font-size: 13px; color: var(--text-mid); background: var(--primary-light); padding: 10px 14px; border-radius: var(--radius-sm); margin-bottom: 14px; line-height: 1.6; }
.q-text { font-size: 18px; font-weight: 800; line-height: 1.5; margin-bottom: 20px; }
.choices { display: flex; flex-direction: column; gap: 12px; }
.choice { padding: 16px 18px; border: 2.5px solid var(--border); border-radius: var(--radius); font-size: 15px; line-height: 1.5; cursor: pointer; transition: all 0.2s; background: var(--card); text-align: left; font-weight: 500; min-height: 54px; display: flex; align-items: center; }
.choice:active { transform: scale(0.97); box-shadow: 0 0 0 4px rgba(93,220,207,0.2); }
.choice.selected { border-color: var(--teal); background: var(--teal-light); font-weight: 700; }

/* ===== Value Cards ===== */
.value-cards-section { text-align: center; padding-top: 20px; }
.value-cards-section h2 { font-size: 22px; font-weight: 800; margin-bottom: 24px; }
.value-card { border-radius: var(--radius); padding: 0; margin-bottom: 20px; text-align: left; overflow: hidden; animation: slideUp 0.5s ease forwards; opacity: 0; }
.value-card:nth-child(2) { animation-delay: 0.2s; }
.value-card:nth-child(3) { animation-delay: 0.4s; }
@keyframes slideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
.vc-header { padding: 20px 20px 16px; color: #fff; position: relative; overflow: hidden; }
.vc-header::before { content: ''; position: absolute; top: -30px; right: -30px; width: 100px; height: 100px; border-radius: 50%; background: rgba(255,255,255,0.1); }
.vc-header::after { content: ''; position: absolute; bottom: -20px; left: -20px; width: 70px; height: 70px; border-radius: 50%; background: rgba(255,255,255,0.08); }
.value-card:nth-child(1) .vc-header { background: linear-gradient(135deg, #0D9488, #14b8a6); }
.value-card:nth-child(2) .vc-header { background: linear-gradient(135deg, #2563eb, #30b6fe); }
.value-card:nth-child(3) .vc-header { background: linear-gradient(135deg, #ea580c, #fdb12e); }
.vc-rank { font-size: 13px; font-weight: 800; opacity: 0.8; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.vc-title-row { display: flex; align-items: center; gap: 12px; }
.vc-icon { width: 48px; height: 48px; background: rgba(255,255,255,0.2); border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.vc-icon i { width: 26px; height: 26px; color: #fff; }
.value-card .title { font-size: 24px; font-weight: 900; color: #fff; line-height: 1.2; }
.vc-body { padding: 16px 20px 20px; background: var(--card); border: 2px solid var(--border); border-top: none; border-radius: 0 0 var(--radius) var(--radius); }
.value-card .reason { font-size: 14px; color: var(--text-mid); line-height: 1.7; margin-bottom: 8px; }
.value-card .subtype { font-size: 13px; font-weight: 800; margin-bottom: 10px; padding: 8px 14px; border-radius: var(--radius-sm); display: inline-block; }
.value-card:nth-child(1) .subtype { background: var(--teal-light); color: var(--teal); }
.value-card:nth-child(2) .subtype { background: var(--blue-light); color: var(--blue); }
.value-card:nth-child(3) .subtype { background: var(--orange-light); color: var(--orange); }
.value-card .evidence { font-size: 13px; line-height: 1.6; background: var(--bg); border-radius: var(--radius-sm); padding: 12px 14px; border: 1px solid var(--border); }
.value-card .evidence-label { font-size: 11px; font-weight: 800; color: var(--text-sub); margin-bottom: 6px; letter-spacing: 0.5px; }

/* ===== Profile ===== */
.profile-hero { text-align: center; padding: 24px 0 16px; }
.profile-hero-title { font-size: 22px; font-weight: 900; margin-bottom: 4px; }
.profile-hero-sub { font-size: 13px; color: var(--text-sub); }
.profile-type-cards { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; align-items: stretch; }
@media (min-width: 768px) { .profile-type-cards { flex-direction: row; } }
.profile-type-card { border-radius: var(--radius); overflow: hidden; flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ptc-header { padding: 12px; color: #fff; display: flex; align-items: center; gap: 8px; }
.ptc-rank { font-size: 12px; font-weight: 800; opacity: 0.7; }
.ptc-icon { width: 28px; height: 28px; flex-shrink: 0; background: rgba(255,255,255,0.2); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
.ptc-icon i { width: 18px; height: 18px; color: #fff; }
.ptc-name { font-size: 13px; font-weight: 900; }
.ptc-body { padding: 14px; background: var(--card); border-radius: 0 0 var(--radius) var(--radius); flex: 1; display: flex; flex-direction: column; }
.ptc-label { font-size: 10px; font-weight: 800; color: var(--text-sub); margin-bottom: 4px; letter-spacing: 0.5px; }
.ptc-desc { font-size: 12px; color: var(--text); line-height: 1.7; margin-bottom: 10px; font-weight: 600; }
.ptc-subtype { font-size: 11px; font-weight: 800; padding: 5px 10px; border-radius: var(--radius-pill); display: inline-block; margin-bottom: 10px; }
.ptc-evidence { font-size: 11px; color: var(--text-mid); line-height: 1.6; background: var(--bg); border-radius: var(--radius-sm); padding: 10px; margin-top: auto; }
.ptc-ev-title { font-size: 10px; font-weight: 800; color: var(--text-sub); margin-bottom: 6px; }
.ptc-ev-line { margin-bottom: 3px; }
.profile-section { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
.profile-section-title { font-size: 14px; font-weight: 800; margin-bottom: 10px; color: var(--text); }
.profile-stats { display: flex; gap: 10px; margin-bottom: 14px; }
.profile-stat { flex: 1; background: var(--card); border-radius: var(--radius); padding: 14px; text-align: center; }
.profile-stat-num { font-size: 28px; font-weight: 900; color: var(--primary); line-height: 1; }
.profile-stat-label { font-size: 11px; color: var(--text-sub); margin-top: 4px; font-weight: 700; }
.work-style-tag { display: inline-block; padding: 8px 14px; border-radius: var(--radius-pill); font-size: 12px; font-weight: 800; margin: 0 6px 8px 0; background: var(--primary-light); color: var(--primary); }

/* ===== Booth cards (all companies / challenge) ===== */
.booth-card { background: var(--card); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; transition: all 0.3s; border: 2px solid var(--border); }
.booth-card:active { border-color: var(--teal); }
.booth-header { padding: 16px; cursor: pointer; display: flex; align-items: flex-start; gap: 12px; }
.booth-info { flex: 1; min-width: 0; }
.booth-name { font-size: 15px; font-weight: 800; margin-bottom: 4px; }
.booth-industry { font-size: 11px; color: #fff; display: inline-block; padding: 3px 10px; border-radius: var(--radius-pill); margin-bottom: 6px; font-weight: 700; background: var(--teal); }
.booth-connection { font-size: 13px; color: var(--text-mid); font-weight: 600; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.booth-right { display: flex; flex-direction: column; align-items: center; gap: 8px; flex-shrink: 0; }
.booth-arrow { color: var(--text-sub); transition: transform 0.3s; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; }
.booth-card.open .booth-arrow { transform: rotate(180deg); }
.booth-detail { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
.booth-card.open .booth-detail { max-height: none; }
.booth-detail-inner { padding: 4px 16px 16px; border-top: 2px solid var(--border); }
.detail-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
.detail-item:last-child { border-bottom: none; }
.detail-label { font-size: 11px; color: var(--text-sub); font-weight: 800; margin-bottom: 6px; letter-spacing: 0.5px; text-transform: uppercase; }
.detail-text { font-size: 14px; line-height: 1.7; color: var(--text-mid); }
.detail-evidence { background: var(--teal-light); border-radius: var(--radius-sm); padding: 10px 14px; margin-top: 8px; font-size: 13px; line-height: 1.6; }
.detail-evidence-user { color: var(--text-sub); }
.detail-evidence-company { color: var(--primary); font-weight: 700; }
.value-match-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.value-match-tag { font-size: 11px; padding: 4px 12px; border-radius: var(--radius-pill); font-weight: 800; color: #fff; }
.vt-1 { background: var(--teal); }
.vt-2 { background: var(--blue); }
.vt-3 { background: var(--orange); }


/* ===== Profile icon ===== */
.profile-icon { width: 40px; height: 40px; border-radius: 50%; background: var(--primary-light); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; }
.profile-icon:active { opacity: 0.7; transform: scale(0.9); }
.profile-icon svg { width: 22px; height: 22px; fill: var(--primary); }
.profile-icon.hidden { display: none; }

/* ===== Top tabs ===== */
.top-tabs { display: flex; background: var(--bg); position: sticky; top: 49px; z-index: 99; padding: 0 4px; border-bottom: 1px solid var(--border); }
.top-tabs.hidden { display: none; }
.tab-item { flex: 1; padding: 12px 4px 10px; text-align: center; cursor: pointer; font-size: 12px; font-weight: 800; color: var(--text-sub); border: none; background: none; font-family: inherit; border-bottom: 3px solid transparent; transition: all 0.2s; }
.tab-item.active { color: var(--primary); border-bottom-color: var(--primary); }
.tab-item svg, .tab-item i { width: 15px; height: 15px; vertical-align: -3px; margin-right: 3px; }

/* ===== Horizontal scroll / Summary cards ===== */
.hscroll-row { display: flex; overflow-x: auto; gap: 16px; padding: 12px 4px 16px; -webkit-overflow-scrolling: touch; scroll-snap-type: x mandatory; }
.hscroll-row::-webkit-scrollbar { display: none; }
.summary-card { width: 80vw; max-width: 320px; background: var(--card); border-radius: var(--radius); padding: 0; cursor: pointer; transition: all 0.2s; scroll-snap-align: center; flex-shrink: 0; display: flex; flex-direction: column; overflow: hidden; }
.summary-card:active { transform: scale(0.97); }
.sc-img { width: 100%; aspect-ratio: 4/3; overflow: hidden; position: relative; background: #fff; }
.sc-img img { width: 100%; height: 100%; object-fit: contain; }
.sc-body { padding: 16px; flex: 1; display: flex; flex-direction: column; gap: 10px; }
.sc-name { font-size: 16px; font-weight: 800; line-height: 1.3; }
.sc-work { font-size: 14px; font-weight: 800; color: var(--primary); line-height: 1.4; }
.sc-pr { font-size: 13px; line-height: 1.6; color: var(--text-mid); }
.sc-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
.sc-tag { font-size: 10px; padding: 4px 10px; border-radius: var(--radius-pill); font-weight: 800; color: #fff; }
.sc-tag-industry { background: var(--teal); }
.sc-tag-type { background: var(--blue); }
.sc-footer { padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
.sc-detail-hint { font-size: 12px; color: var(--text-sub); font-weight: 600; }
.sc-plan-btn { padding: 8px 16px; border: 2px solid var(--primary); border-radius: var(--radius-pill); font-size: 13px; font-weight: 800; cursor: pointer; background: transparent; color: var(--primary); transition: all 0.2s; white-space: nowrap; font-family: inherit; }
.sc-plan-btn:active { background: var(--primary); color: #fff; }
.sc-plan-btn.done { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ===== Back button ===== */
.back-btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; border: none; background: none; font-size: 15px; font-weight: 800; color: var(--primary); cursor: pointer; font-family: inherit; margin-bottom: 8px; }
.back-btn:active { opacity: 0.6; }

/* ===== Filter chips ===== */
.filter-row { display: flex; overflow-x: auto; gap: 8px; margin-bottom: 20px; padding: 4px 0; -webkit-overflow-scrolling: touch; }
.filter-row::-webkit-scrollbar { display: none; }
.filter-chip { padding: 8px 16px; border: 2px solid var(--border); border-radius: var(--radius-pill); font-size: 13px; font-weight: 800; cursor: pointer; background: var(--card); color: var(--text-sub); transition: all 0.2s; white-space: nowrap; flex-shrink: 0; }
.filter-chip.active { border-color: var(--primary); background: var(--primary); color: #fff; }
.filter-chip.planned-filter { border-color: var(--accent); color: var(--accent); }
.filter-chip.planned-filter.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.filter-chip:active { transform: scale(0.95); }
.all-company-count { font-size: 13px; color: var(--text-sub); margin-bottom: 12px; font-weight: 600; }
.all-cards-grid { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; }
.all-cards-grid .summary-card { scroll-snap-align: none; flex-shrink: 0; }


/* ===== Section titles ===== */
.section-title { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
.section-sub { font-size: 14px; color: var(--text-sub); margin-bottom: 20px; }
.industry-section { margin-bottom: 24px; }
.industry-section-label { font-size: 15px; font-weight: 800; color: var(--text); padding: 10px 0 4px; border-bottom: 2px solid var(--teal); margin-bottom: 4px; display: inline-block; }
.section-title { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
.section-sub { font-size: 14px; color: var(--text-sub); margin-bottom: 16px; }
.fade-in { animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.mid-feedback { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 28px 20px; text-align: center; }
.mid-feedback .mid-icon { font-size: 44px; margin-bottom: 14px; }
.mid-feedback .mid-text { font-size: 16px; line-height: 1.7; margin-bottom: 20px; color: var(--text); }
.mid-feedback .mid-highlight { font-weight: 800; color: var(--primary); }
/* Industry select */
.industry-chip { display: inline-block; padding: 12px 18px; border: 2.5px solid var(--border); border-radius: 24px; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.15s; margin: 0 8px 12px 0; background: var(--card); }
.industry-chip.selected { border-color: var(--primary); background: var(--primary-light); color: var(--primary); }
.industry-chip:active { transform: scale(0.95); }
/* Industry group toggle */
.industry-group { margin-bottom: 14px; }
.industry-group-header { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; font-size: 16px; font-weight: 800; }
.industry-group-header .ig-count { font-size: 13px; color: var(--text-sub); font-weight: 500; margin-left: 6px; }
.industry-group-header .ig-arrow { font-size: 14px; color: var(--text-sub); transition: transform 0.3s; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; background: var(--bg); border-radius: 50%; }
.industry-group.open .ig-arrow { transform: rotate(180deg); }
.industry-group-body { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
.industry-group.open .industry-group-body { max-height: 5000px; padding-top: 8px; }
/* Plan button */
.plan-btn { display: inline-block; padding: 8px 14px; border: 2px solid var(--accent); border-radius: 20px; font-size: 12px; font-weight: 800; cursor: pointer; background: transparent; color: var(--accent); transition: all 0.15s; white-space: nowrap; }
.plan-btn:active { background: var(--accent); color: #fff; transform: scale(0.95); }
/* Planned section */
.planned-toggle { background: var(--accent-light); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 16px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
.planned-toggle .pt-title { font-size: 16px; font-weight: 800; color: #9a3412; }
.planned-toggle .pt-count { font-size: 15px; color: #c2410c; font-weight: 700; }
.planned-toggle .pt-arrow { font-size: 14px; color: #c2410c; transition: transform 0.3s; }

// ===== Supabase 初期化 =====
var SUPABASE_URL = 'https://nivvfuobqzqusvtrrmhm.supabase.co';
var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pdnZmdW9icXpxdXN2dHJybWhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0NjQ0ODksImV4cCI6MjA5MTA0MDQ4OX0.COP0rSDRPwa3L2WwPe-CiLcQpSJ5lnDQbUcguM9b6WM';
var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
var currentUserId = null;
var currentSchool = null;

// 学校コード取得（URLパラメータ ?s=xxx）
function getSchoolCode() {
  var params = new URLSearchParams(window.location.search);
  return params.get('s') || null;
}

// Cookie helpers
function setCookie(name, value, days) {
  var d = new Date();
  d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
  document.cookie = name + '=' + value + ';expires=' + d.toUTCString() + ';path=/;SameSite=Lax';
}
function getCookie(name) {
  var match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
  return match ? match[2] : null;
}

// ユーザーID管理（LocalStorage + Cookie + Supabase）
function saveUserId(id) {
  localStorage.setItem('jibun_navi_user_id', id);
  setCookie('jibun_navi_user_id', id, 365);
}
function loadUserId() {
  return localStorage.getItem('jibun_navi_user_id') || getCookie('jibun_navi_user_id') || null;
}

async function initUser() {
  var school = getSchoolCode();
  // 学校コードをlocalStorageにも保存（再訪時パラメータなしでも使えるように）
  if (school) {
    localStorage.setItem('jibun_navi_school', school);
  } else {
    school = localStorage.getItem('jibun_navi_school') || null;
  }
  currentSchool = school;

  var storedId = loadUserId();
  if (storedId) {
    var { data } = await sb.from('users').select('*').eq('id', storedId).single();
    if (data) {
      currentUserId = data.id;
      saveUserId(data.id);
      // 学校コードが未設定 or 変更された場合は更新
      if (school && data.school !== school) {
        await sb.from('users').update({ school: school }).eq('id', data.id);
      }
      return data;
    }
  }
  // 新規ユーザー作成
  var insertData = {};
  if (school) insertData.school = school;
  var { data, error } = await sb.from('users').insert(insertData).select().single();
  if (error) { console.error('User create error:', error); return null; }
  currentUserId = data.id;
  saveUserId(data.id);
  return data;
}

// 回答を保存
async function saveAnswer(questionNum, choiceData) {
  if (!currentUserId) return;
  await sb.from('answers').upsert({
    user_id: currentUserId,
    question_num: questionNum,
    choice_index: choiceData.choiceIndex,
    choice_short: choiceData.short,
    tags: choiceData.tags || [],
    axis: choiceData.axis || null,
    branch: choiceData.branch || null,
    subtype: choiceData.subtype || null,
    role: choiceData.role || null
  }, { onConflict: 'user_id,question_num' });
  // 進捗更新
  await sb.from('users').update({ current_question: questionNum + 1 }).eq('id', currentUserId);
}

// 結果を保存
async function saveResults() {
  if (!currentUserId) return;
  await sb.from('results').upsert({
    user_id: currentUserId,
    top_branches: topBranches,
    subtype_text: subtypeText,
    branch_counts: branchCounts
  }, { onConflict: 'user_id' });
  await sb.from('users').update({ completed: true }).eq('id', currentUserId);
}

// 興味ありを保存
async function savePlannedVisit(companyId) {
  if (!currentUserId) return;
  await sb.from('planned_visits').upsert({
    user_id: currentUserId,
    company_id: companyId
  }, { onConflict: 'user_id,company_id' });
}

// 興味ありを削除
async function removePlannedVisit(companyId) {
  if (!currentUserId) return;
  await sb.from('planned_visits').delete()
    .eq('user_id', currentUserId).eq('company_id', companyId);
}


// 業種選択を保存（LocalStorageのみ）
function saveIndustrySelection() {
  localStorage.setItem('jibun_navi_industries', JSON.stringify(selectedIndustries));
}
function loadIndustrySelection() {
  var stored = localStorage.getItem('jibun_navi_industries');
  if (stored) { try { selectedIndustries = JSON.parse(stored); } catch(e){} }
}

// 中断データの復元
async function restoreSession() {
  if (!currentUserId) return false;

  // 回答を復元
  var { data: savedAnswers } = await sb.from('answers')
    .select('*').eq('user_id', currentUserId).order('question_num');
  if (!savedAnswers || savedAnswers.length === 0) return false;

  // answersとスコアを再構築
  savedAnswers.forEach(function(sa) {
    var idx = sa.question_num;
    answers[idx] = {
      text: '', short: sa.choice_short || '',
      tags: sa.tags || [], axis: sa.axis || null,
      branch: sa.branch || null, subtype: sa.subtype || null,
      role: sa.role || null, choiceIndex: sa.choice_index
    };
    // スコア再計算: actionのみ+1
    if (sa.role === 'action') {
      (sa.tags || []).forEach(function(t) {
        if (branchCounts.hasOwnProperty(t)) branchCounts[t] = (branchCounts[t] || 0) + 1;
      });
    }
  });

  // 結果を復元
  var { data: savedResult } = await sb.from('results')
    .select('*').eq('user_id', currentUserId).single();
  if (savedResult) {
    topBranches = savedResult.top_branches || [];
    subtypeText = savedResult.subtype_text || '';
    if (savedResult.branch_counts) branchCounts = savedResult.branch_counts;
  }

  // 興味ありを復元
  var { data: savedPlanned } = await sb.from('planned_visits')
    .select('company_id').eq('user_id', currentUserId);
  if (savedPlanned) {
    savedPlanned.forEach(function(p) { plannedCompanies[p.company_id] = true; });
  }


  // 業種選択を復元
  loadIndustrySelection();

  return true;
}

// 起動時の復元処理
async function bootApp() {
  var userData = await initUser();
  if (!userData) return;

  var hasData = await restoreSession();
  if (hasData && topBranches.length > 0) {
    // 結果まで出ている → ブースナビへ
    calculateAllCompanies();
    renderProfileContent();
    hideAllScreens();
    showScreen('screenBooth');
    showTabs();
    setActiveTab('booth');
    renderBoothList();
  } else if (hasData && answers.length > 0) {
    // 途中まで回答 → 続きの質問へ
    var nextQ = 0;
    for (var i = 0; i < 7; i++) { if (answers[i]) nextQ = i + 1; }
    allQuestions = INTRO_Q.concat(EPISODE_1).concat(EPISODE_2);
    hideAllScreens();
    document.getElementById('topTabs').classList.add('hidden');
    document.getElementById('progressWrap').style.display = 'block';
    showScreen('screenQuestions');
    renderQuestion(nextQ);
  }
  else {
    // 新規ユーザー → Welcome画面を表示
    showScreen('screenWelcome');
  }
}

  { id:7, booth:'7', work:'', image:'images/7.jpg', name:'なかつ情報通信開発センター株式会社', industry:'情報・通信業', jobs:["技術職"], pr:'中津市役所内での自治体業務が中心。地域に根差し、若手が多数活躍するIT企業です。', detail:'自治体システムの開発・運用やケーブルテレビ事業を通じ、地域社会を支えるIT企業です。未経験からでも安心の丁寧な実務指導に加え、会社がバックアップする資格取得支援制度により、着実なスキルアップを後押しします。年間休日120日、残業も少なく、地元で公私共に充実しながら成長できる環境です。', atmosphere:'', valueTags:["analyze", "growth"], matchTexts:{analyze:'情報を整理し筋道を立てて課題を解決する仕事', growth:'未経験からスキルアップできる環境', stable:'安定した待遇で長く働ける環境'}, sections:[{"label": "入社後の仕事", "content": "自治体システムの開発・運用保守やサーバ監視、データ集計など、ＩＴで地域社会を支える業務に従事します。ケーブルテレビの番組制作や設備保守、加入者訪問など地域密着の仕事も行います。業務は丁寧に指導され、資格取得支援制度により未経験から専門スキルを磨ける環境です"}, {"label": "求める人物像", "content": "自治体や放送事業を通じ、地域社会へ貢献したい意欲のある方を求めます。PCの基本操作ができ、周囲と円滑な連携ができるコミュニケーション能力を重視します。ITの実務経験や基本情報技術者の資格があれば尚良しですが、未経験でも丁寧な指導があるため、自ら学び成長する前向きな姿勢を歓迎します"}, {"label": "今後の展望", "content": "自治体システムや放送事業を通じ地域社会を支え、更なる発展を目指します。ITと放送を融合させ利便性向上に貢献します。資格取得支援等の教育を充実させ、増員による組織強化を図りながら、次世代と共に成長し続ける地域密着の企業を目指します"}], asks:["自治体システムの開発って、高卒で入った先輩は最初どんな業務から覚えていくんですか？", "ITの仕事とケーブルテレビの番組制作や加入者訪問って、担当は分かれているんですか？それとも両方経験できるんですか？", "基本情報技術者などの資格は、働きながらどれくらいの期間で取る先輩が多いですか？"], connectionText:'中津市役所内での自治体業務が中心。地域に根差し、若手が多数活躍するIT企業です。' },
  { id:8, booth:'8', work:'', image:'images/8.jpg', name:'株式会社 シーゲル', industry:'製造業', jobs:["製造職"], pr:'様々な環境変化に対応し、従業員、地元地域に明るい未来を創造し続ける会社です。', detail:'インストルメントパネルやドアトリムなどの自動車内装部品の製造・組立を手がけています。樹脂成形から組立、検査までの一貫体制により、高品質な製品を安定供給しています。', atmosphere:'', valueTags:["team", "craft"], matchTexts:{team:'仲間と協力して仕事を進める環境', craft:'自分の手で製品やサービスを形にする仕事', stable:'安定した待遇で長く働ける環境'}, sections:[{"label": "入社後の仕事", "content": "入社後は、成形・組立・検査など、それぞれの工程に配属され、まずは基本的な作業からスタートします。作業手順や安全ルールを一つひとつ覚えながら、できることを少しずつ増やしていきます。<br>先輩社員が丁寧に教えるので、未経験でも安心です。"}, {"label": "求める人物像", "content": "モノづくりに興味があり、あいさつや返事などの基本を大切にしながら、まじめに取り組める方を歓迎します。前向きに挑戦し、成長したい方を応援します。"}, {"label": "社員に人気の福利厚生", "content": "社員同士の交流を深めるBBQや忘年会、クラブ活動などのイベントがあります。夏には熱中症予防としてオリジナルTシャツの支給やかき氷の提供も行っています。職場やイベントの様子はInstagramで紹介中。ぜひチェックしてみてください。"}], asks:["車の内装部品を作る中で、一番気をつけているポイントは何ですか？", "高卒で入った先輩は、何年目くらいから自分の判断で作業を進められるようになりますか？", "成形・組立・検査の中で、新しく入った人が最初に任されることが多いのはどの工程ですか？"], connectionText:'様々な環境変化に対応し、従業員、地元地域に明るい未来を創造し続ける会社です。' },
  { id:9, booth:'9', work:'', image:'images/9.jpg', name:'株式会社ディーアクト 九州工場', industry:'製造業', jobs:["製造職"], pr:'「ダイハツ工業グループ」自由闊達で多くの仲間とともに挑戦していく企業風土を大切にしています。', detail:'ダイハツグループの一員として、自動車部品を中心に各種部品の開発・生産を担っています。 主に自動車のコアとなる骨格部分を手がけており、高い評価を得てすべてのダイハツ車に採用されています。', atmosphere:'', valueTags:["craft", "growth", "stable"], matchTexts:{craft:'自分の手で製品やサービスを形にする仕事', growth:'未経験からスキルアップできる環境', stable:'安定した待遇で長く働ける環境'}, sections:[{"label": "社員に人気の福利厚生", "content": "ファミレスの様な食堂で、日替わりの各定食や好きな麺類・デザートをその日の気分で選んでいただけます。<br>また、会社が半額負担しているのでとても安価で提供しています。 従業員の憩いの場にもなっています。<br>完全週休2日制の土日休みです。※繁忙期により休出あり 年間休日は121日で、GW・お盆・年末年始は9連休～11連休ほど長いお休みがある為、 趣味やプライベートの時間を充実できる環境です。"}, {"label": "求める人物像", "content": "経験・年齢・性別は問いません。<br>現場ではトレーナーが丁寧にレクチャーするので、ご安心ください。 明るくやる気のある方をお待ちしています。"}], asks:["ダイハツ車の骨格部分を作るとのことですが、自分が関わった部品がどの車種に使われているか分かりますか？", "入社後のトレーナーは、どんな風に仕事を教えてくれますか？", "ダイハツの車の骨格部分を作る上で、安全のためにどんなチェックをしているんですか？"], connectionText:'「ダイハツ工業グループ」自由闊達で多くの仲間とともに挑戦していく企業風土を大切にしています。' },
  { id:10, booth:'10', work:'', image:'images/10.png', name:'鬼怒川ゴム工業株式会社 九州生産部 第一工場', industry:'製造業', jobs:["製造技能職"], pr:'EV時代も需要が続く部品を、軽量化技術で支える会社です。', detail:'当社は自動車用ゴム・樹脂製造専門会社として世界の自動車産業の発展と共に歩んでいます。 九州第一工場では自動車用ゴム、樹脂部品の車体シール部品（ドア周り、トランクのボディ側等）の製造を行っています。', atmosphere:'', valueTags:["craft", "growth", "stable"], matchTexts:{craft:'自分の手で製品やサービスを形にする仕事', analyze:'情報を整理し筋道を立てて課題を解決する仕事', stable:'安定した待遇で長く働ける環境'}, sections:[{"label": "入社後の仕事", "content": "入社後は本社・国内他拠点と合同で新入社員研修を行い、基礎から丁寧に学べる環境を整えています。<br>その後現場へ配属となり、就業状況や適性を見ながら配置転換も実施。 将来的には幅広い職種へ挑戦できます。（例　生産オペレーター　⇒　技術職・管理部門など）"}, {"label": "求める人物像", "content": "・コツコツ丁寧に作業できる方<br>・やる気をもって前向きに取り組める方<br>・落ち着いた環境で長く働きたい方<br>前向きに挑戦するやる気のある方、大歓迎です！！"}, {"label": "社員に人気の福利厚生", "content": "◇社員食堂・食事補助あり 　栄養士さんの考えたバランスの取れた食事を低価格で提供しています。 ◇各種自動販売機設置（24時間利用可能） 　飲料、お菓子、アイスクリーム、カップラーメン、パン"}], asks:["入社した後、どんな仕事のステップアップがありますか？", "EV時代でも需要が続くゴム・樹脂部品って、具体的にどんな部分に使われているんですか？", "新入社員研修で本社や他拠点の同期と交流できるそうですが、配属後もつながりは続きますか？"], connectionText:'EV時代も需要が続く部品を、軽量化技術で支える会社です。' },
  { id:11, booth:'1', work:'', image:'images/11.PNG', name:'株式会社ヨロズ大分 大分マニュファクチャリングセンター', industry:'製造業', jobs:["保全職", "生産職"], pr:'建物は古いですが、笑顔が絶えない明るい職場です。', detail:'ヨロズグループは、サスペンションを主体とする自動車部品メーカーとして、自動車メーカー各社から信頼を得てまいりました。 ヨロズ大分は、健康で働きがいのある職場づくりの取り組みとして、健康経営優良企業に認定されています。', atmosphere:'', valueTags:["craft", "growth"], matchTexts:{team:'仲間と協力して仕事を進める環境', craft:'自分の手で製品やサービスを形にする仕事'}, sections:[{"label": "職場の雰囲気", "content": "若い世代の成長も著しく、笑い声の絶えない快活な職場です。"}, {"label": "求める人物像", "content": "元気とやる気があれば、経験や資格が無くても大丈夫です。 必要な技能・技術・資格は、入社後にOJTや通信教育、外部講習（会社負担）等で取得可能です。 ※OJT：日常業務を通じて先輩が後輩に指導する教育"}, {"label": "入社後の仕事", "content": "＊生産職：プレス、組立設備のオペレーター<br>＊技術（保全）職：プレス機、ロボット、溶接機、治具の保全<br>＊生産管理、品質保証：生産計画、品質パトロール等"}], asks:["プレスや組立のオペレーターは、入社してどれくらいで一人で機械を任せてもらえますか？", "社員の健康のために、会社でやっている取り組みはありますか？", "サスペンション部品って、どんな車に使われているか自分で確認できますか？"], connectionText:'建物は古いですが、笑顔が絶えない明るい職場です。' },
  { id:12, booth:'2', work:'', image:'images/12.jpg', name:'株式会社 ナカノ', industry:'不動産・物品賃貸業', jobs:["技術職"], pr:'建設機械のレンタル・販売で、街のインフラ工事を支える地域密着カンパニー！！', detail:'創業70周年～地域密着～ 地元のお客様に愛される会社で４つの事業を営んでいます。<br>1.建設機械器具類のレンタル・販売・修理<br>2.レンタカー各種<br>3.中古機械及び車輛の販売・買取<br>4.選挙看板のレンタル・販売・設置および選挙機械器具資材の販売', atmosphere:'', valueTags:["craft", "stable"], matchTexts:{support:'人の役に立ち「ありがとう」と言われる仕事', stable:'安定した待遇で長く働ける環境'}, sections:[{"label": "求める人物像", "content": "明るく元気な挨拶ができる方<br>地元愛にあふれる方<br>機械いじりが好きな方"}, {"label": "職場の雰囲気", "content": "明るく活気のある職場です。<br>休日も多く、仕事とプライベートの両立が図れます。<br>若手社員の頑張りをベテラン社員が全力で支えてくれます。"}, {"label": "入社後の仕事", "content": "職種は建設機械の営業職、整備職の二つです。<br>入社後は営業職、整備職問わず、建設機械に関する知識を学びます。 営業職は各営業所で接客も含め一定期間の研修を行います。<br>整備職は中津営業所にて機械整備・点検などを中心に一定期間の研修を行います。 機械整備に必要な資格は会社費用負担で取得をサポートします。"}], asks:["建設機械の営業と整備、それぞれ1日の仕事の流れはどんな感じですか？", "会社負担で取れる資格には、具体的にどんなものがありますか？", "地元のお客さんとのやり取りで、印象に残っているエピソードを教えてもらえますか？"], connectionText:'建設機械のレンタル・販売で、街のインフラ工事を支える地域密着カンパニー！！' },
  { id:13, booth:'3', work:'', image:'images/13.jpeg', name:'中津鋼管工業株式会社', industry:'製造業', jobs:["営業職", "製造職", "品質保証", "生産管理"], pr:'中津で冷間引抜鋼管を作り続けて56年。さらに幅広い分野への展開を目指します。', detail:'弊社は、「冷間引抜鋼管（れいかんひきぬきこうかん）」を主力製品とする金属加工メーカーです。 鋼管をより強く、より高い精度で様々な寸法に加工することが出来ます。 弊社の製品の多くは、安全性が強く求められる自動車の重要部品に採用されており、このことからも技術力の高さを感じ取っていただけるはずです。', atmosphere:'', valueTags:["craft", "stable"], matchTexts:{team:'仲間と協力して仕事を進める環境', craft:'自分の手で製品やサービスを形にする仕事', stable:'安定した待遇で長く働ける環境'}, sections:[{"label": "今後の展望", "content": "半世紀を超える歴史のなかで着実に成長を遂げ、安定した経営基盤を築き上げています。 冷間引抜鋼管へのニーズは多様で、自動車の他にプラントやビル、船舶など幅広い分野において活用されています。 今後はその安定基盤のもと、自動車の分野で培った高い技術力で新たな分野にもチャレンジしていきたいと考えております。"}, {"label": "求める人物像", "content": "新しい時代を切り開いていくにあたって欠かせないのが、意欲を持って仕事に取り組んでくれる若いみなさんです。当社の人材観は「働く一両、考える五両」という言葉に集約できます。指示を待っているだけ（働く一両）ではなく、自ら考えて行動する（考える五両）を重視しています。"}, {"label": "職場の雰囲気", "content": "部署の垣根を超えた和気あいあいとした社風が自慢です！ プライベートでも仲の良い社員同士でスポーツや釣りなどを楽しんでいます。 年間休日数は124日。完全週休二日制（土日休み）に加え長期休暇もあるので、ゆっくりリフレッシュできます。"}], asks:["冷間引抜鋼管って、自動車のどんな部品に使われているんですか？", "仕事をする中で、会社が大切にしている考え方は何ですか？", "自動車以外の新分野にチャレンジするとしたら、具体的にどんな業界を考えていますか？"], connectionText:'中津で冷間引抜鋼管を作り続けて56年。さらに幅広い分野への展開を目指します。' },
  { id:14, booth:'4', work:'', image:'images/14.jpg', name:'マレリ九州株式会社 中津工場', industry:'製造業', jobs:["製造職"], pr:'自動車部品（マフラー）を製造しているマレリ九州です。 一緒に楽しく働きましょう。', detail:'2019年11月にカルソニックカンセイ九州からマレリ九州に社名変更しました。マレリグループのコーポレートビジョン実現に向けて、地元企業として地域貢献を果たしながら、世界をリードするモノづくり革新で、モノづくり競争力No1を目指します。 ”お客様とパートナーと共に、モビリティの未来を共創する”', atmosphere:'', valueTags:["team", "craft", "stable"], matchTexts:{team:'仲間と協力して仕事を進める環境', craft:'自分の手で製品やサービスを形にする仕事'}, sections:[{"label": "職場の雰囲気", "content": "私たちの職場は、自動車部品製造（マフラー）を行っています。 若手からベテランまで声を掛け合い、分からない事はすぐに聞ける明るい職場です。 先輩が丁寧に教えてくれるので、工場勤務が初めてでも安心です。 モノづくりの達成感を我々と一緒に味わいましょう。"}, {"label": "求める人物像", "content": "・コミュニケーション（報連相）を大切にする人<br>・周囲と協力し、思いやりを持って行動できる人<br>・分からない事を「分からない」とはっきり言える人<br>・小さなことでもコツコツ努力を続けられる人<br>・自分の意見を持ち、相手の意見も大切にできる人<br>・失敗を恐れず、成長を楽しめる人"}, {"label": "社員に人気の福利厚生", "content": "社員が安心して長く働けるよう、各種社会保険をはじめ、休暇制度や手当など福利厚生を整えています。 中でもリフレッシュ休暇は1週間連続で休暇を取得でき、心も体もリフレッシュできます。 また、社員向けに新車を安く購入できる制度があります。 車が身近な仕事ならではの、うれしい福利厚生です。"}], asks:["マフラー製造の工程で、高卒1年目の先輩はどんな作業から始めますか？", "リフレッシュ休暇の1週間連続休暇、みなさんどんな使い方をしていますか？", "工場勤務が初めての人は、最初どんな練習や作業から始めますか？"], connectionText:'自動車部品（マフラー）を製造しているマレリ九州です。 一緒に楽しく働きましょう。' },
  { id:15, booth:'5', work:'', image:'images/15.JPG', name:'株式会社西野物産', industry:'製造業', jobs:["事務職", "製造職"], pr:'創業から113年！国内トップクラスの実績を持つ食品加工メーカー！', detail:'弊社では皆さんが口にするカップ麺に入っている具材を包装しています。日本を代表する大手食品メーカーの大半と取引をしており、安定した業績を維持しています。', atmosphere:'', valueTags:["team", "craft"], matchTexts:{team:'仲間と協力して仕事を進める環境', support:'人の役に立ち「ありがとう」と言われる仕事', stable:'安定した待遇で長く働ける環境'}, sections:[{"label": "入社後の仕事", "content": "入社後約1週間の全体研修後、製造職は各工場に配属、事務職は引き続き約1週間の研修を行い、各部署に配属となります。配属後は各部署で業務を行います。"}, {"label": "求める人物像", "content": "様々な部署や職種を経験できる弊社では、自身の成長意欲のある方やチャレンジ精神のある方を求めています。また、食品の安全と衛生を大切にしながら、コツコツと丁寧に作業ができる方、周りと協力して仕事に取り組める方も歓迎します。未経験でも先輩が丁寧に教えますので安心してご応募ください。"}, {"label": "職場の雰囲気", "content": "幅広い年齢層の社員が多数在籍しており、上下関係も気にせず皆で協力して仕事をしています。他部署の従業員との連携も強く、社員同士の相談やコミュニケーションも非常に取りやすい職場です。衛生管理も徹底しており、職場は常に清潔で空調管理もされているため、一年を通して快適で働きやすい職場環境です。"}], asks:["カップ麺の具材を包装する工程って、どんな機械を使って作業するんですか？", "製造職と事務職で、どちらも経験できるような部署異動はありますか？", "食品の安全と衛生を守るために、毎日必ずやっているルーティンは何ですか？"], connectionText:'創業から113年！国内トップクラスの実績を持つ食品加工メーカー！' },
  { id:16, booth:'6', work:'', image:'images/16.png', name:'株式会社積水化成品大分', industry:'製造業', jobs:["製造職"], pr:'発泡プラスチックのトップメーカーである積水化成工業株式会社の１００％子会社です。', detail:'"当社は、発泡プラスチックスのパイオニア である積水化成品の九州地区における生 産会社として、発泡ポリスチレンシートの製 造を行っています。 生活に欠かせない食品トレーをはじめ、 カップ麺・納豆容器、青果用シートなどに加 工・使用されています。"', atmosphere:'', valueTags:["craft", "stable"], matchTexts:{craft:'自分の手で製品やサービスを形にする仕事', stable:'安定した待遇で長く働ける環境'}, sections:[{"label": "入社後の仕事", "content": "生活に欠かせない、さまざまな製品に加工される発泡プラスチックス製品の製造・品質管理を行います。わずかな温度や圧力差によって品質が大きく変わってしまいます。都度厳しくチェックすることで、製品のクオリティを維持する重要なポジションであり、仕事を通して専門的な技術を身に付けることができます。"}, {"label": "職場の雰囲気", "content": "３５歳以下の若手社員が多く活躍しています。有給休暇も取得し易く、人間関係も良好で離職率の低い職場です。三交替勤務ですが、平日の休日や昼間の時間を利用しプライベートも充実できます。"}, {"label": "社員に人気の福利厚生", "content": "◉社員食堂あり<br>◉年間休日124日程度（夏季休暇・年末年始休暇あり）<br>◉リフレッシュ休暇 勤続10年：3日間／勤続20年・30年：5日間<br>◉結婚休暇5日間<br>◉産前産後休業<br>◉育児休<br>◉出産休暇<br>◉子の看護休暇<br>◉介護休暇"}], asks:["温度や圧力差で品質が変わるそうですが、どうやってそれをチェックしているんですか？", "三交替勤務のリズムに慣れるまで、どれくらいかかりましたか？", "食品トレーやカップ麺容器の原料シートを作っているそうですが、身近な製品で確認できますか？"], connectionText:'発泡プラスチックのトップメーカーである積水化成工業株式会社の１００％子会社です。' },
  { id:17, booth:'7', work:'', image:'images/17.jpg', name:'九州市光工業株式会社', industry:'製造業', jobs:["製造職", "技術職"], pr:'冷暖房完備で女性も働きやすい環境です。', detail:'日本初のプロジェクターヘッドランプや、水銀フリーHID ヘッドランプや次世代の光源として注目されているLEDヘッドランプ等、独自の製品製造を行ってきました。2017年より工場を拡張した上、フランスのヴァレオグループとなり、グローバルサプライヤーとして事業拡大中です。', atmosphere:'', valueTags:["craft", "growth"], matchTexts:{craft:'自分の手で製品やサービスを形にする仕事', analyze:'情報を整理し筋道を立てて課題を解決する仕事', stable:'安定した待遇で長く働ける環境'}, sections:[{"label": "今後の展望", "content": "国内主力車種のヘッドランプとリアランプの生産を控えており、業績拡大の計画です。"}, {"label": "社員に人気の福利厚生", "content": "花見やボウリング大会、ゴルフ大会で和気あいあいと楽しい職場環境です。"}, {"label": "成長を支援する制度", "content": "E-larningや集合研修など充実した能力開発のシステムがあり、成長を実感できます。"}], asks:["LEDヘッドランプの製造って、手作業と機械のどちらが多い工程ですか？", "海外のグループ会社とのつながりで、何か変わったことはありますか？", "E-ラーニングや集合研修では、具体的にどんなことが学べますか？"], connectionText:'冷暖房完備で女性も働きやすい環境です。' },
  { id:18, booth:'8', work:'', image:'images/18.jpg', name:'日鉄精密加工株式会社', industry:'製造業', jobs:["技術職"], pr:'日本製鉄㈱の100％子会社で安定した就業環境でお仕事頂けます！', detail:'■カップリング（油井管継手）事業<br>→石油を掘削するときに使用する油井管パイプの継手を製造しています。大手オイルメジャー等、世界で品質が認められています。 <br>■精密機械加工事業<br>→鉄鋼素材を加工して、クレーン車輪などの機械部品や土木基礎用の 鋼管杭、日本製鉄の製鉄所で使用される治工具等を製造しています。', atmosphere:'', valueTags:["team", "craft", "growth"], matchTexts:{craft:'自分の手で製品やサービスを形にする仕事', analyze:'情報を整理し筋道を立てて課題を解決する仕事', stable:'安定した待遇で長く働ける環境'}, sections:[{"label": "入社後の仕事", "content": "＜STEP.01＞<br>まずは座学を通して製品の知識と安全管理について学んでいきます。<br>＜STEP.02＞<br>現場へ配属。最初のうちは先輩の横について仕事をじっくり覚えます。<br>なお独り立ちをするにあたっては独自の社内資格が必要。これはだいたい入社半年～1年ほどで取得できます。"}, {"label": "成長を支援する制度", "content": "・各種公的資格取得支援 入社後、会社の全額費用負担のもと資格取得を目指せます。 受験料のみならず学校に通う費用も当社が負担。この支援制度を活かし、あなたも資格をGETください！"}, {"label": "求める人物像", "content": "・チームワークを大切にしているので積極的にコミュニケーションを取れる人<br>→困ったときは助け合う。先輩が後輩を常にフォローする。そうした温かな風土が根づいています <br>・モノづくりに興味がある人<br>→「好きこそ物の上手なれ」という言葉があるように、モノづくりが好きなら自然とスキルアップを望めます。"}], asks:["高卒で入った先輩は、どんな部署に配属されることが多いですか？", "独り立ちのための社内資格って、どんな内容の試験なんですか？", "公的資格の取得支援で、過去に人気だった資格は何ですか？"], connectionText:'日本製鉄㈱の100％子会社で安定した就業環境でお仕事頂けます！' },
  { id:19, booth:'9', work:'', image:'images/19.jpg', name:'有限会社 岡崎建具製作所', industry:'製造業', jobs:["製造職"], pr:'『ものづくり』に興味があれば、知識・経験がなくても手に職をつけることができます。', detail:'主に木製の建具(ドア)・家具の製作を行ってます。製作した建具・家具は、こども園や学校、病院、高齢者施設、飲食店等へ取りつけています。私たちと一緒に、お客様に末永く愛用される製品づくりをしませんか？', atmosphere:'', valueTags:["craft", "growth"], matchTexts:{craft:'自分の手で製品やサービスを形にする仕事', stable:'安定した待遇で長く働ける環境'}, sections:[{"label": "入社後の仕事", "content": "まずは先輩社員の作業補助や清掃作業を行いながら、少しずつ仕事を覚えていきます。徐々に工具や機械を使用しながら、作業を任されるようになります。最初から難しい作業や危険な作業をすることはありません。"}, {"label": "求める人物像", "content": "・ものづくりに興味のある方<br>・お客様に末永く愛用してもらえる製品づくりを共に目指せる方<br>・経験を積み、資格取得を目指したい方(資格取得補助制度有り)"}, {"label": "職場の雰囲気", "content": "少人数ながら、20代から60代までの幅広い世代が活躍しています。個人作業が多いですが、わからないことがあれば丁寧に指導します。ミーティングには社長も加わり、和やかな雰囲気です。"}], asks:["こども園や学校の建具を作るとのことですが、完成品を見に行くことはありますか？", "木工の技術を身につけるのに、だいたい何年くらいかかりますか？", "資格取得補助制度で、どんな資格を取る先輩が多いですか？"], connectionText:'『ものづくり』に興味があれば、知識・経験がなくても手に職をつけることができます。' },
  { id:20, booth:'10', work:'', image:'images/20.png', name:'株式会社ジェイピー・ネット', industry:'卸売・小売業', jobs:["営業職", "営業職", "フィールドサポート"], pr:'未経験でも興味があれば大歓迎です！ 笑顔で働ける職場づくりを目指しています。', detail:'未経験でもやってみたい気持ちがあれば大歓迎です！ 笑顔で働ける職場づくりを目指しています。', atmosphere:'', valueTags:["team", "support"], matchTexts:{support:'人の役に立ち「ありがとう」と言われる仕事'}, sections:[{"label": "入社後の仕事", "content": "入社後は先輩社員と同行による研修指導をおこない、お客様との会話の仕方や提案の流れを学びながら、少しずつ仕事を覚えていただきます。 お客様のお困りごとを聞き、サービスをご案内します。見積作成や導入までのフォローも少しずつ担当します。 研修やサポートがあるので、未経験でも安心です。"}, {"label": "求める人物像", "content": "地元愛があり、明るく、挨拶がしっかりできる方。 新しいことに前向きにチャレンジできる方。 チームで協力しながら成長したい方。"}, {"label": "社員に人気の福利厚生", "content": "参加自由な懇親会や社員旅行などの社内行事が充実しています。 インフルエンザや健康診断、資格取得の助成など働きやすい環境を目指しています。 無料で利用できる提携ジムもあり、健康づくりにも意識を高めています。"}], asks:["お客様のお困りごとって、具体的にどんな相談が多いんですか？", "未経験から始めた先輩は、何ヶ月くらいで1人で提案できるようになりますか？", "お客様にサービスを提案するとき、どんな会話から始めますか？"], connectionText:'未経験でも興味があれば大歓迎です！ 笑顔で働ける職場づくりを目指しています。' },
  { id:21, booth:'1', work:'', image:'images/21.jpg', name:'ルネサスエレクトロニクス株式会社 大分工場', industry:'製造業', jobs:["保全技術職"], pr:'ルネサス大分工場は昨年操業40周年を迎えた半導体後工程の生産拠点です', detail:'ルネサス エレクトロニクスは、研究開発から設計、製造、販売までの 全ての各種半導体の行程を行う、グローバルな半導体会社です。	 日立製作所、三菱電機、NECを起源とする歴史ある強力な技術基盤を有しています。', atmosphere:'', valueTags:["craft", "analyze", "stable"], singleOnly:true, matchTexts:{craft:'自分の手で製品やサービスを形にする仕事', analyze:'情報を整理し筋道を立てて課題を解決する仕事', growth:'未経験からスキルアップできる環境', stable:'安定した待遇で長く働ける環境'}, sections:[{"label": "求める人物像", "content": "積極的にコミュニケーションをとり、日々進化する半導体業界において、自己研鑽と常に新しい知識やスキル習得を意識する人物"}, {"label": "社員に人気の福利厚生", "content": "・作業環境・労働条件ともに充実し、安全で快適な職場です。<br>・福利厚生施設として、食堂・売店があります。<br>・有給休暇は初年度から18日付与退職金、企業年金制度、各種休暇 　も充実しています"}, {"label": "入社後の仕事", "content": "『設備保全員』とは 装置の調子が悪いときに部品交換や調整など修理をしたり、常に良い状態が保てるように 点検したりして装置の維持管理をしています。また、更に装置を良くする改善も行っています"}], asks:["設備保全員として、1日でどれくらいの装置を点検するんですか？", "半導体後工程って、前工程と何が違うんですか？", "40周年を迎えた工場で、これから新しく導入される技術はありますか？"], connectionText:'ルネサス大分工場は昨年操業40周年を迎えた半導体後工程の生産拠点です' },
  { id:22, booth:'2', work:'', image:'images/22.jpg', name:'株式会社 耶馬溪製作所', industry:'製造業', jobs:["組立課　ブレーカ組立業務", "部品課　部品加工業務", "資材倉庫管理業務"], pr:'産業用ブレーカで世界を支え、安全な電気利用を実現！船舶向けブレーカシェア世界一', detail:'私たちの会社は、発電所や船舶など大規模設備向けの産業用ブレーカを製造し、世界の約60％の海外市場で活躍。特に船舶用ブレーカは世界No.1シェアです。電気の安全を守り電気の安全を守る技術はこれからの社会に欠かせない分野です。私たちは世界のインフラを支える製品づくりを通して、安心して電気を使える未来をつくっています。', atmosphere:'', valueTags:["craft", "stable"], matchTexts:{support:'人の役に立ち「ありがとう」と言われる仕事', craft:'自分の手で製品やサービスを形にする仕事', stable:'安定した待遇で長く働ける環境'}, sections:[{"label": "入社後の仕事", "content": "組立課：多種多様なブレーカの組立・検査を行い、スイッチや遠隔操作装置などのオプション取り付けも行います。<br>部品課：ブレーカに必要な部品を原材料を使って加工します。加工機械やロボットのセッティングなども重要な業務です。<br>品質管理課：納入部品の受入検査を行います。様々な種類の部品を検査しますが単純作業が続かないのが特徴の職場です。<br>耶馬溪製作所はほとんどのラインがコンベア生産方式ではないので自分のペースで安心して作業できます。女性が多く活躍しているのも特徴です。"}, {"label": "職場の雰囲気", "content": "年間有給平均取得日数14.5日と有給取得しやすい職場です。前年度未使用分は繰り越しでき最大40日になります。自分自身のイベントや学校行事、家庭の用事など事前申請だけでなく、急な体調不良、緊急の用事なども融通がききます。また、日勤なので生活リズムが安定し、年齢が上がってからも身体に優しい職場です。"}], asks:["船舶用ブレーカ世界シェア1位って、具体的にどんな船に使われているんですか？", "コンベア方式じゃなくて自分のペースで作業できるって、実際どんな感じですか？", "有給が最大40日繰り越せるって、みなさんまとめて使ったりするんですか？"], connectionText:'産業用ブレーカで世界を支え、安全な電気利用を実現！船舶向けブレーカシェア世界一' },
  { id:23, booth:'3', work:'', image:'images/23.jpg', name:'太陽インダストリー株式会社 中津工場・中津新田工場', industry:'製造業', jobs:["製造職"], pr:'”つくる”を通じて、”つながる”社会へ！！', detail:'60年以上にも及ぶ歴史の中で培われた豊富な経験とノウハウを活かして、段ボールケース製造をはじめ人工大理石・レジンコンクリート・FRP製品等、多種多様な分野で事業展開し安定した成長を続けています。', atmosphere:'', valueTags:["team", "craft"], matchTexts:{team:'仲間と協力して仕事を進める環境', craft:'自分の手で製品やサービスを形にする仕事'}, sections:[{"label": "入社後の仕事", "content": "入社後は社会人としての心構え・安全教育・工場ルール・作業教育などを研修後、配属先部門で先輩指導員から6ヶ月程度モノづくりのノウハウや製品知識など実習し学んでもらいます。又、必要に応じて資格など取得し個々のスキルアップを目指して事業運営に貢献して頂きます。"}, {"label": "求める人物像", "content": "・社内外を問わず積極的にコミュニケーションをとって失敗を恐れない行動力のある方<br>・心身ともに健康で明るく楽しく元気で、礼節を大切にする、やる気のある方<br>・モノづくりが好きな方<br>・会社のルールを守れる方 経験や知識がなくても活躍できるように育成していきますので、安心して永く働けます。"}, {"label": "職場の雰囲気", "content": "・20～70代までの幅広い年齢層の方がプロ意識を持ちながら真剣に、且つ楽しく勤務してます<br>・『従業員の安全・安心』を最優先に、働きやすい職場づくりを全従業員で実施中<br>・仕事とプライベートをバランス良く充実させる為に、会社が全力でバックアップ<br>・厚生会では従業員同士の絆が深まるイベントを毎年企画実施"}], asks:["段ボール、人工大理石、FRPなど多種多様ですが、配属先はどう決まるんですか？", "6ヶ月の実習期間で、どこまでの作業ができるようになりますか？", "6ヶ月の実習期間中に、取得を目指す資格はありますか？"], connectionText:'”つくる”を通じて、”つながる”社会へ！！' },
  { id:24, booth:'4', work:'', image:'images/24.jpg', name:'有限会社 サンエイデンタル', industry:'医療・福祉業', jobs:["歯科技工士"], pr:'すべては患者様の健康と笑顔のために', detail:'「歯科技工士」という歯科医療のスペシャリスト集団です。歯科医師の指示により入れ歯・かぶせ物等の人工の歯を製作しています。性別問わず活躍しており、関東を中心に全国レベルの技術を提供しています。', atmosphere:'', valueTags:["support", "craft", "growth"], matchTexts:{support:'人の役に立ち「ありがとう」と言われる仕事', craft:'自分の手で製品やサービスを形にする仕事', growth:'未経験からスキルアップできる環境'}, sections:[{"label": "入社後の仕事", "content": "各部署に配属後、模型処理作業を中心に先輩社員の指導のもと、知識と技術の向上を目指します。入れ歯・マウスピース・前装冠・ハイブリットセラミック・CAD/CAM冠・ジルコニアなど様々な製品を製作しているので、適性や今後の目標を聞きながら専門性を高めていきます。"}, {"label": "成長を支援する制度", "content": "歯科技工士になるために、大分県歯科技工士育成基金奨学金や返済支援制度など、専門学校を卒業し国家試験に合格するための支援が充実しています。また、専門学校と連携しインターンシップの受け入れも行っています。"}, {"label": "社員に人気の福利厚生", "content": "会社主催のBBQ大会や社員旅行などの楽しいイベントや、サークル活動がとても活発です。仕事から離れてにぎやかな雰囲気の中で、社員同士の親交が深まり職場での結束力が生まれています。"}], asks:["歯科技工士になるには専門学校進学が必要とのことですが、高校生のうちにできる準備はありますか？", "入れ歯やジルコニアなど製品の種類が多いですが、自分の専門を決めるタイミングはいつですか？", "奨学金や返済支援制度は、具体的にどれくらい補助してもらえますか？"], connectionText:'すべては患者様の健康と笑顔のために' },
  { id:25, booth:'5', work:'', image:'images/25.jpg', name:'株式会社TF-METAL九州', industry:'製造業', jobs:["事務職", "製造職", "技術職"], pr:'車のシートフレームの加工・組立・検査を通し、安全で快適な移動を提供する会社です。', detail:'「座るを支え・世界をツナグ」を合言葉に、TF－METAL九州は、自動車用シートフレームを製造しています。<br>私達はグローバル企業における日本の生産拠点として、世界に誇る技術と品質を提供する会社です。<br>太陽光パネルの設置などサステナブルな社会の実現の為、SDGsへの取り組みにも積極的に参加しています。', atmosphere:'', valueTags:["craft", "growth"], matchTexts:{team:'仲間と協力して仕事を進める環境', craft:'自分の手で製品やサービスを形にする仕事'}, sections:[{"label": "求める人物像", "content": "明るく前向きで　行動力と熱意のある人財、 学歴よりも経験や能力が企業の成長を左右すると考えています。 何事にも好奇心を持ち、学びに情熱をもって成長し続ける人を求めます。"}, {"label": "今後の展望", "content": "今までに培った技術を活かし、フレーム生産のみならず、プレス～カチオン電着塗装～ロボット溶接～フレーム組立の一環生産が可能な工場を実現し、更なるビジネスの拡大を目指していきます。"}, {"label": "社員に人気の福利厚生", "content": "各種イベントの定期的な開催を通じて、社員のモチベーション向上と、コミュニケーションアップを図っています。<br>■うどんサービスデー<br>■オータムフェスティバル<br>■クリスマスプレゼント<br>■オアシス活動<br>■バーベキュー大会<br>など"}], asks:["シートフレームの製造って、溶接や組立のどの工程が一番難しいんですか？", "これから会社で新しく始まる仕事やチャレンジはありますか？", "シートフレームを作るとき、プレスや溶接などいろんな工程がありますが、未経験から始めて一人前になるまでどれくらいかかりますか？"], connectionText:'車のシートフレームの加工・組立・検査を通し、安全で快適な移動を提供する会社です。' },
  { id:26, booth:'6', work:'', image:'images/26.jpg', name:'TOTOサニテクノ株式会社', industry:'製造業', jobs:["製造職"], pr:'ＴＯＴＯサニテクノは、ＴＯＴＯグループの中核となる衛生陶器事業を担う会社です。', detail:'創業以来続く「親切が第一」、「奉仕の精神」を忘れずに、良品の供給とお客様の満足を追求し、社会から必要とされる企業であり続けたいと願っています。 世界中のお客様のために、「人と環境にやさしい未来」を創造します。 国内最大の腰掛便器の生産拠点として、主力の腰掛便器の他、洗面器・手洗器等を生産しています。', atmosphere:'', valueTags:["craft", "growth", "stable"], singleOnly:true, matchTexts:{support:'人の役に立ち「ありがとう」と言われる仕事', craft:'自分の手で製品やサービスを形にする仕事', stable:'安定した待遇で長く働ける環境'}, sections:[{"label": "職場の雰囲気", "content": "◆高卒新入社員からベテラン社員まで幅広い年齢層が働いています。<br>◆業務だけに限らず、改善活動なども活発なので和気あいあいとしています。<br>◆新入社員の教育にも力をいれています。"}, {"label": "求める人物像", "content": "◆強い「自覚と意志」を持ち、自ら学び成長する自律人財。<br>◆自律人財とは、ＴＯＴＯグループの想いや方向性に共感し、自分の役割を理解した上で、何をすべきかを自分で考えて行動する人財。"}, {"label": "社員に人気の福利厚生", "content": "◆社会保険完備（健康保険・厚生年金・雇用保険・労災）<br>◆通勤費・定期券代支給<br>◆ＴＯＴＯ直営保養所あり 　家族や友人と社員価格で宿泊できます！<br>◆結婚・出産・慶弔時に給付金あり<br>◆カフェテリアプラン制度（医療費補助等）<br>◆年間休日123日/有給休暇 最大20日付与/GW・お盆・年末年始に長期連休あり"}], asks:["国内最大の便器生産拠点とのことですが、1日にどれくらい作っているんですか？", "新入社員にまず覚えてほしいことは何ですか？", "若手社員が「入ってよかった」と感じるのはどんな時ですか？"], connectionText:'ＴＯＴＯサニテクノは、ＴＯＴＯグループの中核となる衛生陶器事業を担う会社です。' },
  { id:27, booth:'7', work:'', image:'images/27.png', name:'株式会社サンレー', industry:'生活・娯楽業', jobs:["営業職", "接客職"], pr:'人生の大切な節目に寄り添い、自分自身も成長できる仕事がここにあります。', detail:'創業60年を迎える冠婚葬祭のサンレーは、葬祭会館「紫雲閣」の運営、結婚式場「VILLA LUCE」をはじめとする結婚式場・衣裳店の運営、互助会事業を展開。人生の節目を支える総合儀式サービス企業として、地域に根ざした安心と感動を提供しています。', atmosphere:'', valueTags:["team", "support"], matchTexts:{support:'人の役に立ち「ありがとう」と言われる仕事'}, sections:[{"label": "職場の雰囲気", "content": "人の人生の節目に寄り添う仕事だからこそ、思いやりとチームワークを大切にする温かい職場です。若手からベテランまで互いに支え合いながら学び、成長していける環境があります。"}, {"label": "入社後の仕事", "content": "【葬祭部門の場合】<br>入社後は研修をしたうえで、まずは先輩社員に付いて実務を学びます。<br>その後は、ご家族様との打ち合わせやセレモニー運営を担当します。丁寧にお話を伺い、故人様の人生やご家族の想いに寄り添ったご提案を行います。「あなたでよかった」と言われるやりがいを実感できる仕事です。"}, {"label": "求める人物像", "content": "人と関わることが好きで、相手の気持ちを大切にできる方を求めています。特別な知識や経験は必要ありません。入社後に先輩が丁寧に教えるので安心して成長できます。仲間と協力しながら、人の役に立つ仕事がしたいという気持ちを持ち、前向きに学び続けられる方を歓迎します。"}], asks:["ご家族との打ち合わせを任されるようになるまで、入社からどれくらいの期間がかかりますか？", "葬祭部門と結婚式場部門だと、若手のうちはどちらに配属されることが多いですか？", "お客様から「あなたでよかった」と言われたエピソードがあれば教えてもらえますか？"], connectionText:'人生の大切な節目に寄り添い、自分自身も成長できる仕事がここにあります。' },
  { id:28, booth:'8', work:'', image:'images/28.jpg', name:'株式会社 ユーテック', industry:'製造業', jobs:["製造職", "技術職"], pr:'操業22年、従業員数90名の家族観溢れたアットホームな会社です。', detail:'自動車用内外装部品の樹脂成形・塗装（カラー塗装・植毛塗装)の加工工場です。 日々塗装の技術向上を目指し誠心誠意さまざまなご要望にお応えする事を使命と考え、 お客様に満足していただける製品づくりに努めています。', atmosphere:'', valueTags:["team", "craft"], matchTexts:{craft:'自分の手で製品やサービスを形にする仕事', growth:'未経験からスキルアップできる環境'}, sections:[{"label": "職場の雰囲気", "content": "職場単位でチームを組み、みんなで協力しながら製品を作り上げていきます。 支え合う職場でより良い製品が作り出されます。"}, {"label": "今後の展望", "content": "2026年度に新たな事業として成形棟を増築し樹脂成形事業を開始しています。 新たな事に色々と挑戦していくチャレンジ企業です。"}, {"label": "社員に人気の福利厚生", "content": "各種コミュニケーションイベントを開催しています。 毎年末には従業員全員でクリスマス会を行い食事会と福引大会等を行って 従業員間のコミュニケーションを取っています。"}], asks:["入社したら、最初はどんな作業から始めますか？", "2026年新設の成形棟では、どんな新しい仕事ができるようになりますか?", "90名規模ならではの、大手にはない良さって何ですか？"], connectionText:'操業22年、従業員数90名の家族観溢れたアットホームな会社です。' },
  { id:29, booth:'9', work:'', image:'images/29.jpg', name:'株式会社ＫＯＴＡＮＩ', industry:'製造業', jobs:["製造職"], pr:'地元中津で若手が元気に活躍中！社会を支えるセラミック加工の仕事です。', detail:'セラミックを機械で加工するものづくりの仕事です。コツコツ続けることで技術が身につき、いろいろな製品を支える力になります。地元中津の工場で、毎日仲間と協力しながら取り組んでいます。', atmosphere:'', valueTags:["team", "craft", "growth"], matchTexts:{team:'仲間と協力して仕事を進める環境', craft:'自分の手で製品やサービスを形にする仕事', stable:'安定した待遇で長く働ける環境'}, sections:[{"label": "入社後の仕事", "content": "入社後はまず安全やルールを学ぶところからスタート。その後は先輩と一緒に加工機を操作し、セラミック製品をセットし、寸法や仕上がりを確認しながら作業を覚えます。先輩のサポートを受けながら少しずつ技術を身につけ、習得後は自分で製品の加工を管理し、品質と安全を守る大切な役割を任されます。"}, {"label": "職場の雰囲気", "content": "年齢や性別に関係なく、ものづくりが好きな仲間が集まる元気な職場です。未経験からスタートした先輩も多く、みんなで声をかけ合いながら成長しています。分からないこともすぐ聞ける、チームワーク抜群の環境です。"}, {"label": "成長を支援する制度", "content": "資格取得は会社が費用をサポート。作業に必要なものやスキルアップにつながる資格も、安心して挑戦できます。研修や勉強会もあり、仕事だけでなく社会人としても成長できる環境です。"}], asks:["セラミック加工って、具体的にどんな製品を作っているんですか？", "未経験から入った先輩は、何ヶ月くらいで一人で機械を任せてもらえますか？", "会社がサポートしてくれる資格で、人気なものはどれですか？"], connectionText:'地元中津で若手が元気に活躍中！社会を支えるセラミック加工の仕事です。' },
  { id:30, booth:'10', work:'', image:'images/30.jpg', name:'株式会社 梶原組', industry:'建設業', jobs:["技術職"], pr:'もの造りを通して、地域に貢献する会社です。', detail:'スーパーゼネコンの下請け工事、地元企業工場のメンテナンスやリノベーション等、建築工事全般を行っている会社です。 私たちのモットーは【技術力で地域に貢献】、安全・品質・環境保全はもちろんのこと、お客様の要望により多く応えられるオンリー１の技術力を目指しています。', atmosphere:'', valueTags:["support", "craft", "growth"], matchTexts:{team:'仲間と協力して仕事を進める環境', craft:'自分の手で製品やサービスを形にする仕事'}, sections:[{"label": "入社後の仕事", "content": "現場管理業務（品質管理・施工管理・工程管理・安全管理）<br>現場調査、見積もりから図面の作成等の現場管理を行います。"}, {"label": "成長を支援する制度", "content": "資格取得の為のサポートが充実！ 社員一人ひとりのスキルアップを全力で応援しています。 資格取得にかかる受験料や教材費はもちろん、講習等の受講料も会社が全額負担。 さらに、合格時にはお祝い金も支給！"}, {"label": "求める人物像", "content": "お客様の声に耳を傾け、思いをくみとり、形にする。 そして、自分の仕事に誠実かつ真剣に向き合える方を求めます。"}], asks:["今まで関わった工事で、一番大きかった現場はどんなものですか？", "施工管理の仕事で、1年目の先輩はどこまで任せてもらえますか？", "資格取得のお祝い金って、どんな資格でいくらくらい出るんですか？"], connectionText:'もの造りを通して、地域に貢献する会社です。' },
  { id:31, booth:'1', work:'', image:'images/31.png', name:'株式会社かがし屋', industry:'情報・通信業', jobs:["接客職"], pr:'従業員が、安心して、夢中で、「働く」ことを楽しめる環境づくりを大切にしています！', detail:'福岡・大分で、文具用品・OA機器販売をはじめ、ステーショナリーショップ、ドコモショップ、ベーカリーの運営、介護福祉事業や太陽光発電事業など、地域に密着した９つの事業を展開しています。“地域に愛される企業”を志し、社会の価値観の変化を的確にキャッチしながら事業の多角化と規模の拡大に取組んでいます。', atmosphere:'', valueTags:["support", "team"], matchTexts:{support:'人の役に立ち「ありがとう」と言われる仕事', growth:'未経験からスキルアップできる環境'}, sections:[{"label": "求める人物像", "content": "・地元で腰を据えて働きたい<br>・人とコミュニケーションをとることが好き<br>・人の役に立ちたい、人から感謝されることがモチベーションになる<br>・残業時間を抑えて仕事と自分の時間を両立したい<br>・チームワーク重視の職場環境で働きたい"}, {"label": "入社後の仕事", "content": "・店舗にいらしたお客様への接客・販売、受付業務<br>・携帯電話、スマートフォン、タブレットの新規契約手続き<br>・機種変更・契約内容の変更手続き<br>・操作方法やサービスなど各種相談への対応<br>・店内のPOP作成・キャンペーン対応<br>・イベント店舗の運営（イベント会社と共同で運営します）"}, {"label": "今後の展望", "content": "「地域のチカラ共創企業」へと進化します！地域に深く根を下ろし、欠かせない存在として、地域のお客様と共に未来へ挑戦します。そして「100億円企業」という高みを目指して参ります。この大きな挑戦を担う主役である従業員の皆様が、安心して、夢中で、楽しく働ける環境づくりに全力で取り組んで参ります！"}], asks:["ドコモショップとベーカリーなど9事業もありますが、配属先はどう決まるんですか？", "スマホ販売で、高卒1年目の先輩が最初に覚える業務は何ですか？", "「100億円企業」を目指す中で、高卒社員にはどんな活躍を期待していますか？"], connectionText:'従業員が、安心して、夢中で、「働く」ことを楽しめる環境づくりを大切にしています！' },
  { id:32, booth:'2', work:'', image:'images/32.jpg', name:'株式会社 渡辺製作所', industry:'製造業', jobs:["製造職"], pr:'配管加工技術でクルマの快適と走りを支える自動車部品メーカーです。', detail:'弊社独自の技術力・開発力でアルミ配管部品を中心とした自動車部品の普及と安全性の向上を通じて快適な移動手段の一翼を担うことを目指しており、製品の軽量化・コンパクト化を追求することで、社会全体が無理なくカーボンニュートラルへ向かえるよう貢献できると考え取り組んでいます。', atmosphere:'', valueTags:["team", "craft"], matchTexts:{craft:'自分の手で製品やサービスを形にする仕事', analyze:'情報を整理し筋道を立てて課題を解決する仕事'}, sections:[{"label": "入社後の仕事", "content": "新人教育を受けた後、半年ほど各工程（切断・端末加工・曲げ・ロー付け・気密検査・組立）で現場研修を行いすべての工程を学びます。<br>研修で自社製品が出来るまでを学び、一人一人の適性に合った配属先を決定します。各工程では自社開発した設備を使用しての作業となりますが未経験でも作業がしやすいように工夫しています。"}, {"label": "職場の雰囲気", "content": "社員の平均年齢は37.8歳でその中でも製造現場は若手社員が多く、和気あいあいとした雰囲気です。誰かが休めば皆でフォローするなど支えあいながら日々の生産目標を達成しています。またグループ内で作業内容の改善に取り組むこともあり、こういった活動を通してチーム力も上がってきています。"}, {"label": "今後の展望", "content": "主要大手自動車メーカー工場の九州進出や自動車関連事業工場の建設予定などでの新規需要見込みや昨年度からの新規立ち上げも続いています。 九州工場以外にも国内に４拠点・海外に１拠点のグループ企業全体としても受注拡大を目標とし、また働きやすい職場を目指して今後も更なる成長を図っていきます。"}], asks:["アルミ配管部品の6工程、未経験でも作業しやすい工夫って具体的にどんなものですか？", "製造現場の若手が多いとのことですが、20代の先輩の1日の過ごし方を教えてください。", "九州の新規需要が増えているそうですが、これから仕事はどう変わっていきますか？"], connectionText:'配管加工技術でクルマの快適と走りを支える自動車部品メーカーです。' },
  { id:33, booth:'3', work:'', image:'images/33.jpg', name:'愛宕自動車工業株式会社', industry:'製造業', jobs:["技術職/製造職", "事務職/専門職"], pr:'社食の提供や安心して暮らせる社宅の提供等、衣食住を意識した職場環境を整えています', detail:'自社製品の開発・製造・販売を行っています。「安全と物流を創造するテクニカルファクトリー」の企業理念の下、環境負荷の低減や社会課題の解決に貢献する製品づくりを目指しています。', atmosphere:'', valueTags:["craft", "stable"], matchTexts:{craft:'自分の手で製品やサービスを形にする仕事', analyze:'情報を整理し筋道を立てて課題を解決する仕事', stable:'安定した待遇で長く働ける環境'}, sections:[{"label": "入社後の仕事", "content": "①技術系総合職：自社製品の製造・架装・自動車整備・塗装など。<br>②営業系総合職：自社製品の販売・マーケティング戦略の立案など。<br>③事務系総合職：原価管理・ISO関連業務・安全衛生管理・広報業務など。"}, {"label": "社員に人気の福利厚生", "content": "福利厚生が充実しています。<br>社員食堂あり(1食330円)。<br>シャワールーム・洗濯ルーム完備で、夏季は汗を流してから帰宅できます。<br>社宅があり、遠方からでも安心です。<br>その他社内レクリエーションあり。"}, {"label": "今後の展望", "content": "主力事業である「エコロジーボックス®」「リニボ®」「トラック図書館」「ATAGO‐CUSTOM」を強みに、現在45都道府県への納入実績を４７都道府県に拡大し、全国のお客様に自社製品の提供を行うことです。その幅広いフィールドで意欲的に取り組み、新しいことにチャレンジしたい人を当社では求めています。"}], asks:["「エコロジーボックス」や「リニボ」って、具体的にどんな製品ですか？", "技術・営業・事務の3職種で、高卒入社の先輩はどの職種が多いですか？", "社宅や社食など衣食住の福利厚生、実際に使っている先輩の声を聞かせてください。"], connectionText:'社食の提供や安心して暮らせる社宅の提供等、衣食住を意識した職場環境を整えています' },
  { id:34, booth:'4', work:'', image:'images/34.JPG', name:'有限会社松下モータース', industry:'サービス業', jobs:["技術職", "営業職"], pr:'１９歳からプロの自動車整備士へ！挑戦できる若手育成企業として成長し続けます。', detail:'1969年創業。中津市に根ざした自動車整備工場です。19歳から26歳の若手メカニックが活躍し、先輩がしっかりサポートする育成環境が特長。自社工場で整備・修理を行い、安心・安全な軽自動車を低価格で提供しています。若手がのびのび成長し、地域のカーライフを支え続けています。', atmosphere:'', valueTags:["support", "craft", "growth"], matchTexts:{support:'人の役に立ち「ありがとう」と言われる仕事', craft:'自分の手で製品やサービスを形にする仕事', growth:'未経験からスキルアップできる環境'}, sections:[{"label": "職場の雰囲気", "content": "フロントや営業で多くの女性社員が活躍する職場です。お客様と直接関わり、感謝や信頼の言葉をいただくことで大きなやりがいと誇りを感じられます。「もっと頑張ろう」と前向きな気持ちが生まれ、自分らしく成長できる温かく活気ある雰囲気が整っています。"}, {"label": "求める人物像", "content": "求める人財は<br>・プラス発想な方<br>・素直な方"}, {"label": "今後の展望", "content": "私たちの会社が目指しているのは、「人々の暮らしや社会にとって、なくてはならない存在」になることです。そのために、私たちは常にお客様の立場に立ち、期待を超えるサービスや商品を提供することに挑戦し続けています。また、「社員が幸せになる会社」を目指し、一人ひとりが自分らしく働ける環境づくりを行っています。"}], asks:["19歳からプロの整備士って、具体的にどんな研修やサポートがありますか？", "26歳までの若手メカニックが多いそうですが、先輩との年齢差はどれくらいですか？", "整備以外のフロントや営業では、どんな仕事をしていますか？"], connectionText:'１９歳からプロの自動車整備士へ！挑戦できる若手育成企業として成長し続けます。' },
  { id:35, booth:'5', work:'', image:'images/35.jpg', name:'Design City Japan株式会社', industry:'研究・技術サービス業', jobs:["技術職（機械設計）"], pr:'各種プラント（石油化学、製鉄等）に建設・設置される機器を”設計”しています。', detail:'各種プラント（石油化学、製鉄等）に設置される機械・機器・設備等を”設計”している、いわゆる【設計会社】です。取引先は日本全国に拡がり、海外プラント建設プロジェクトにも数多く携わっています。 主に設計図面の作成、強度計算など基本設計、計画設計、詳細設計を行なっています。耐震設計は、売りの一つです。', atmosphere:'', valueTags:["analyze", "growth"], matchTexts:{team:'仲間と協力して仕事を進める環境', analyze:'情報を整理し筋道を立てて課題を解決する仕事', growth:'未経験からスキルアップできる環境'}, sections:[{"label": "成長を支援する制度", "content": "若手勉強会など社内勉強会を定期的に実施。資格に応じて手厚い手当あり。技術者として着実にステップアップ出来る環境があります！"}, {"label": "求める人物像", "content": "1.わからないこと、経験がないことでも、手を挙げてチャレンジできる人<br>2.問題・課題に気づく力を持ち、柔軟性と好奇心を持って　解決できる人<br>3.現状に満足せず、向上心を持って　学び続けられる人"}, {"label": "入社後の仕事", "content": "入社後１～2か月は社外研修や社内研修で、社会人としてのマナーや、会社や業界について学び、設計者としての心構えを身につけます。CAD操作や図面作成も丁寧に指導します。約4か月後には先輩アシスタントとして、簡単な業務から始めていきます。 メンター制度もあり、業務のことや生活面でもしっかりサポートします。"}], asks:["設計の仕事って、パソコンを使う作業が多いですか？", "耐震設計が売りとのことですが、どんなプロジェクトで評価されましたか？", "メンター制度では、具体的にどんなサポートをしてもらえますか？"], connectionText:'各種プラント（石油化学、製鉄等）に建設・設置される機器を”設計”しています。' },
  { id:36, booth:'6', work:'', image:'images/36.JPG', name:'（株）オモテ', industry:'製造業', jobs:["技術職/製造職"], pr:'社員の平均年齢が38才と若い人が多い元気な会社です。', detail:'当社は自動車完成車メーカーや部品メーカーの工場のラインで使用する自動化設備やロボット装置等の設計から製作までを手掛けています。特にロボットを使った生産用機械設備の製作が得意であり、省力化、人手不足の解消に貢献しており、私たちが製作した機械がアメリカ、ブラジル、南アフリカ等の工場で稼働しています。', atmosphere:'', valueTags:["team", "craft", "analyze"], matchTexts:{craft:'自分の手で製品やサービスを形にする仕事', analyze:'情報を整理し筋道を立てて課題を解決する仕事'}, sections:[{"label": "入社後の仕事", "content": "まずは、新入社員教育や高所、感電防止等安全教育の研修を受けたのち、設計、製缶、加工、組立の各部署に配属されます。部署ごとで「モノづくり」の基礎を先輩たちの指導のもと学んでいきます。"}, {"label": "求める人物像", "content": "明るく元気で何事も前向きに捉える方で、チームで成果を上げることを楽しいと感じる方をもとめています。"}, {"label": "成長を支援する制度", "content": "全トヨタ工場で通用する高所作業、感電防止の研修からクレーン、フォークリフト等各部署で必要な資格を会社の費用で取得してもらいます。"}], asks:["ロボット装置の設計から製作まで、高卒1年目はどの部署に配属されやすいですか？", "アメリカやブラジルで稼働している機械、現地に行く機会はありますか？", "いくつか部署があるそうですが、若手に人気の部署はどこですか？"], connectionText:'社員の平均年齢が38才と若い人が多い元気な会社です。' },
  { id:37, booth:'7', work:'', image:'images/37.jpg', name:'株式会社 三好冷暖房', industry:'建設業', jobs:["技術職"], pr:'弊社は管工事業で建築物に欠かせない空気、水を供給する為の設計施工会社です。', detail:'主な事業内容は、社名でわかるように冷暖房工事ですが様々な工事の設計施工を行っています。 主な顧客は官公庁、大手サブコン、地元工場等ですが一般個人まで気軽に対応しています。 弊社は、昨年創業50年の節目を迎え、新社屋の改装や作業服の変更などを実施しています。', atmosphere:'', valueTags:["craft", "analyze", "growth"], matchTexts:{craft:'自分の手で製品やサービスを形にする仕事', analyze:'情報を整理し筋道を立てて課題を解決する仕事', growth:'未経験からスキルアップできる環境'}, sections:[{"label": "職場の雰囲気", "content": "当社は大分県発注の工事において2年連続で優良建設工事表彰を受賞しています。 これは、当社の技術力の高いところを示すものであり社員のモチベーション向上にもつながっています。"}, {"label": "求める人物像", "content": "建設業は、担い手不足であり、若手入職者が皆無の状態が続いています。 昔で言う「手に職を付ける」チャンスです。 学歴や成績は問いません。ヤル気があり、節度を持った行動が出来れば年齢、性別は問いません。 資格の取得に必要な費用などの補助制度や、合格時の祝金など充実しています。"}, {"label": "社員に人気の福利厚生", "content": "・各種保険、退職金制度有り<br>・週休二日制、有給休暇<br>・資格取得金補助、祝金<br>・健康促進器具設置<br>・会社の行事(慰安旅行、慰労会)<br>・レクレーション(ゴルフ、釣り、カラオケ、ボーリング)"}], asks:["冷暖房工事って、夏と冬でどんな現場が多いですか？", "2年連続で県知事表彰を受けた工事って、具体的にどんな現場でしたか？", "資格取得の祝金って、どんな資格でいくらぐらい出ますか？"], connectionText:'弊社は管工事業で建築物に欠かせない空気、水を供給する為の設計施工会社です。' },
  { id:38, booth:'8', work:'', image:'images/38.jpg', name:'福進株式会社', industry:'製造業', jobs:["製造職", "ドライバー"], pr:'休日数増加・有給休暇取得率の高さ・全世代の働きやすい環境作りに取り組んでます', detail:'1982年の創業以来、生コンクリート製造を中心に地域のインフラを支えてきました。現在は運送事業・建設資材販売・産業廃棄物中間処理業を含む３社のグループ体制で事業を成長展開し、「人」を大切にしながら品質と信頼を追求し、地域の未来づくりに挑戦し続けています。', atmosphere:'', valueTags:["team", "craft", "stable"], matchTexts:{team:'仲間と協力して仕事を進める環境', craft:'自分の手で製品やサービスを形にする仕事', stable:'安定した待遇で長く働ける環境'}, sections:[{"label": "求める人物像", "content": "仲間と協力しながら目標に向かい、明るく前向きに新しい事に挑戦出来る方！ スキルアップのための資格取得もどんどんチャレンジ出来ます。"}, {"label": "職場の雰囲気", "content": "当社では営業から製造、納品までを一貫して行っており、常に部署間同士のコミュニケーションが活発で意見交換が出来る環境が整っています。 社員全員でワンチームとなって業務に取り組んでいます！"}, {"label": "入社後の仕事", "content": "入社後は配属部署で先輩社員の教育のもと、業務を覚えていただきます。 当社には、同業経験者の社員も未経験の社員も多数在籍しています。 一人一人の技量に合わせてサポートしていますので未経験の方も安心して働けます。"}], asks:["生コンクリート製造って、どんな工程で若手が活躍していますか？", "営業・製造・納品を一貫して経験できるそうですが、自分の希望は通りますか？", "休日数増加や有給取得率の高さは、実際どれくらいの数字ですか？"], connectionText:'休日数増加・有給休暇取得率の高さ・全世代の働きやすい環境作りに取り組んでます' },
  { id:39, booth:'9', work:'', image:'images/39.JPG', name:'中津木工株式会社', industry:'製造業', jobs:["事務職", "製造職", "技術職"], pr:'家具造りの伝統と技術を学べる創業89年目を迎えた歴史ある会社です。', detail:'創業89年目を迎え、創業以来「木」と携わってきました。特注家具・建具の設計施工、内装工事、木工事の施工に従事しており、幅広い木製品の完全受注生産を行っています。 主にゼネコンや店舗設計施工会社の依頼で、ホテル・病院、文化施設などの特注家具を中心に、個人住宅の家具・建具など幅広く施工しています。', atmosphere:'', valueTags:["craft", "growth"], matchTexts:{craft:'自分の手で製品やサービスを形にする仕事', stable:'安定した待遇で長く働ける環境'}, sections:[{"label": "入社後の仕事", "content": "ライン作業ではなく、一人の人が最初から最後まで製品を組立ていきますので、先輩社員について基本的な工具や木工機械の使い方を学びながら基本的な家具造りの方法を学んでいきます。 簡単な家具製作の練習をして、製作方法の知識を身につけ、実際に現場へ出向いて家具を取付る知識や技術も身につけていきます。"}, {"label": "求める人物像", "content": "・向上心があり、自分から積極的に聞く姿勢のある方<br>・臨機応変な対応が出来る方<br>・周りの人と協力して作業が出来る方<br>・決められたことだけでなく、何事にも取り組む姿勢のある方"}, {"label": "今後の展望", "content": "もうすぐ創業100周年を迎えようとしていますが、その先の200年を目指しています。 まずは11年後の100周年を一緒に迎え、その先の未来を共に歩んでいきましょう。 長年の技術と経験を大切に、時代や変化の状況に合わせて、地域社会と共に歩む企業であり続けたいと思います。"}], asks:["ホテルや病院の特注家具って、どんな流れで設計から取り付けまで進みますか？", "一人で最初から最後まで作れるようになるまで、何年くらいかかりますか？", "創業100周年に向けて、若手に期待している役割は何ですか？"], connectionText:'家具造りの伝統と技術を学べる創業89年目を迎えた歴史ある会社です。' },
  { id:40, booth:'10', work:'', image:'images/40.JPG', name:'日進コンサルタント株式会社', industry:'建設業', jobs:["技術職"], pr:'道路、河川、砂防、橋梁等の計画で測量・設計を行い構造物を地図に残す仕事です。', detail:'1971年に測量会社として創業し、おかげさまで５４年が過ぎました。主に大分県内の公共事業を受注している測量・設計、点検調査会社です。土木の高い専門性を生かしたコンサルティング業務を行っており、また、豪雨災害等では早期復旧を目指し、災害現場での測量や災害復旧設計に、使命感を持って取り組み、実施しています。', atmosphere:'', valueTags:["analyze", "craft"], matchTexts:{analyze:'情報を整理し筋道を立てて課題を解決する仕事', growth:'未経験からスキルアップできる環境'}, sections:[{"label": "入社後の仕事", "content": "測量・設計とは、現況の地形を測定し道路、ダム、橋梁等を計画するため、設計図面や地図などの基本情報を作成する仕事です。近年は、ドローン等を使った測量も主流になっています。<br>調査業務は、道路、トンネル及び橋梁等を定期的に点検する業務です。近年は、新技術のドローンや調査機器を使用して調査点検を行います。"}, {"label": "社員に人気の福利厚生", "content": "ボーリング大会、懇親会、フルーツ狩り、バーベキュー、社員旅行等の行事を毎年行っています。参加は自由ですが、みんなで楽しく行っています。"}], asks:["ドローン測量って、高卒1年目でも操作できるようになりますか？", "災害復旧の現場に入ることもあるそうですが、どんな状況に駆けつけるんですか？", "測量と設計のどちらからキャリアを始める人が多いですか？"], connectionText:'道路、河川、砂防、橋梁等の計画で測量・設計を行い構造物を地図に残す仕事です。' },
  { id:41, booth:'1', work:'', image:'images/41.jpg', name:'ダイハツ九州株式会社', industry:'製造業', jobs:["技能職"], pr:'中津市で長く働ける、軽自動車づくりを支える安定企業です。', detail:'ダイハツ九州は中津市から全国へ軽自動車を届けるメーカーです。ダイハツの軽自動車の70％、年間40万台を生産しています。安心・安全な職場環境と充実した福利厚生で、地元で長く成長しながら働けます。', atmosphere:'', valueTags:["team", "craft", "stable"], singleOnly:true, matchTexts:{team:'仲間と協力して仕事を進める環境', craft:'自分の手で製品やサービスを形にする仕事', stable:'安定した待遇で長く働ける環境'}, sections:[{"label": "社員に人気の福利厚生", "content": "有給休暇が取得しやすく、社員食堂や独身寮、生活や健康を支える各種補助制度も充実。 年間有給取得は平均17日、完全週休2日制＆年3回の長期連休があり 仕事とプライベートの両立を後押ししています。"}, {"label": "求める人物像", "content": "ものづくりに興味を持ち元気と忍耐力をもって仕事に向き合える人を求めています。仲間とのコミュニケーションを大切にし、決まりを守りながら協力して働けることを重視しています。前向きに学び地元で成長したいという意欲を持ち、高校卒業後の第一歩を安心して踏み出したい方を歓迎します。仲間と共に成長できる環境です。"}, {"label": "今後の展望", "content": "ダイハツ九州は軽自動車生産を支える中核企業として、長年にわたり安定した経営を続けています。確かな生産基盤と需要に支えられ、将来にわたって安心して働ける環境が整った会社です。 こうした安定した事業環境のもと、将来にわたって安心して働ける職場づくりを進めており、従業員一人ひとりが長く活躍できる環境が整った会社です。"}], asks:["軽自動車を年40万台作る工場で、高卒1年目はどの工程に入りますか？", "有給平均17日取得できるそうですが、長期連休と合わせてどんな使い方が人気ですか？", "仕事で一番達成感を感じる瞬間はどんな時ですか？"], connectionText:'中津市で長く働ける、軽自動車づくりを支える安定企業です。' },
  { id:42, booth:'2', work:'', image:'images/42.jpg', name:'株式会社ケアリング', industry:'医療・福祉業', jobs:["介護職"], pr:'子育て中の方も多数！多くの女性が活躍中。自分らしく、笑顔で働ける職場です。', detail:'互いに助け合い、高め合うチームワークが自慢！2000年の創業以来、25年にわたり「心と命」を繋いできました。仕事には真摯に取り組みながらも、遊び心を忘れず、自分らしく生き生きと働けます。子育て中の方も多数活躍中。あなたの「人に寄り添う温かい心」を、ぜひ当社で活かしてください！', atmosphere:'', valueTags:["team", "support", "growth"], matchTexts:{team:'仲間と協力して仕事を進める環境', support:'人の役に立ち「ありがとう」と言われる仕事'}, sections:[{"label": "求める人物像", "content": "・介護の知識やスキルを勉強することに興味がある方<br>・介護の知識を生かして活躍したい方<br>・人と関わるのが好きな方<br>・相手の気持ちを思いやれる方<br>・笑顔で優しく接することができる方<br>・真面目に頑張れる方  どれか一つでも当てはまる方、是非ケアリングへお越しください！"}, {"label": "成長を支援する制度", "content": "「学びたい」気持ちを大切にします。上位資格取得を全力で応援！試験対策のフォローなど、働きながらスキルアップを目指せる環境を整えています。"}, {"label": "社員に人気の福利厚生", "content": "福岡で開催されるケアリング大運動会が人気です。 社員だけでなくお子さんやご家族、お友達まで大集合！「遊ぶときは徹底的に」がケアリング流。世代を超えてみんなで笑い、汗を流して絆を深める、笑顔あふれる一大イベントです！"}], asks:["高卒で入社した場合、介護福祉士などの資格はどんなスケジュールで取得を目指せますか？", "子育て中の方が多いとのことですが、シフトや勤務時間はどんな風に調整されているんですか？", "入社して最初の頃、利用者さんとの関わりで新人さんがつまずきやすいのはどんな場面ですか？"], connectionText:'子育て中の方も多数！多くの女性が活躍中。自分らしく、笑顔で働ける職場です。' },
  { id:43, booth:'3', work:'', image:'images/43.JPG', name:'株式会社ドラッグストアモリ', industry:'卸売・小売業', jobs:["販売職"], pr:'接客経験が無くても大丈夫！入社後に研修があるので安心してお仕事を始められます！', detail:'お薬・化粧品・栄養の知識を活かし、地域の方々の【健康】と【美】をサポートしています。また、ドラモリだけのオリジナル商品の開発にも力を入れており、商品の質はもちろんパッケージデザインなどすべてにこだわっています！また、「社員に厚く」を掲げているドラモリでは、基本給・各種手当も業界最高水準です。', atmosphere:'', valueTags:["support", "growth"], matchTexts:{support:'人の役に立ち「ありがとう」と言われる仕事', analyze:'情報を整理し筋道を立てて課題を解決する仕事', growth:'未経験からスキルアップできる環境'}, sections:[{"label": "求める人物像", "content": "ドラモリでは、高校卒業後に入社して活躍している先輩がたくさんいます！「友だちや先生と関わるのが好き」「誰かに“ありがとう”と言われると嬉しい」「部活や勉強で新しいことに挑戦するのが楽しい」「好きなこと、得意なことを仕事にしたい」そんな高校生のみなさん、ぜひ説明会へお越しください♪"}, {"label": "入社後の仕事", "content": "店舗で店長や先輩社員から、カウンセリングに必要な商品知識や、商品の発注・陳列、レジなどの業務の流れを習得していただきます。 医薬品、化粧品、健康食品、その他商品全般に関する知識、体のことや病気のこと、薬の知識を社内勉強会やＷEＢ勉強会で学び、お客様に沢山の情報を提供していきます。"}, {"label": "成長を支援する制度", "content": "医薬品、化粧品、健康食品、その他取扱い商品全般について、社内勉強会で学んでいきます。体験型の勉強会なので楽しく学べる！その他にも、ＷEＢ勉強会や資格取得勉強会など勤務時間内での教育サポートは業界NO.1です！得意なこと、好きなことを伸ばしてステップアップできます！"}], asks:["医薬品や化粧品の勉強会って、入社後どれくらい時間をかけて学ぶんですか？", "ドラモリオリジナル商品の開発に、若手が関わることはありますか？", "高卒で入った先輩は、何年目くらいで店長を目指せますか？"], connectionText:'接客経験が無くても大丈夫！入社後に研修があるので安心してお仕事を始められます！' },
  { id:44, booth:'4', work:'', image:'images/44.jpg', name:'株式会社 山国商会', industry:'卸売・小売業', jobs:["営業職", "運転職"], pr:'地域を支える基盤となれ！ 産業・医療・生活を支える仕事', detail:'創業68年を迎える総合ガス商社です。 主な事業内容は、酸素/窒素/アルゴンなどの産業用/医療用高圧ガス・溶接材料・ ＬＰガスの販売。 大分県中津市を拠点に、産業・医療・生活を支えています。', atmosphere:'', valueTags:["support", "growth", "stable"], matchTexts:{support:'人の役に立ち「ありがとう」と言われる仕事', stable:'安定した待遇で長く働ける環境'}, sections:[{"label": "入社後の仕事", "content": "トラックにて固定客先（企業、工場、病院など）に ガスや部品を配送。<br>LPガス・酸素ガス等の高圧ガスや溶接機器など様々。 お客様とのコミュニケーションが得意な方大歓迎！<br>将来は営業活動や配管工事も！"}, {"label": "成長を支援する制度", "content": "トラック運転が初めてでも安心！準中型免許は会社負担で免許取得できます。<br>その他仕事につながる資格は、基本的に会社が応援！<br>社員の大半がフォークリフト・玉掛け免許も取得済み。 高圧ガス各種免許もとって、 知識の幅を広げて楽しみましょう。"}, {"label": "職場の雰囲気", "content": "幅広い年代が活躍中で、人間関係が良い環境です。<br>安定した仕事量で安心して働けます。<br>基本的に17時退勤でライフスタイルも充実！ 中津市を盛り上げて、豊かに暮らせます。"}], asks:["高圧ガスを配送するって、1日で何件くらいのお客様を回るんですか？", "準中型免許や高圧ガス免許を取るのに、会社はどれくらい負担してくれますか？", "フォークリフトや玉掛けの免許は、仕事のどんな場面で使いますか？"], connectionText:'地域を支える基盤となれ！ 産業・医療・生活を支える仕事' },
  { id:45, booth:'5', work:'', image:'images/45.jpg', name:'UDトラックス株式会社', industry:'卸売・小売業', jobs:["整備職"], pr:'整備のプロフェッショナルを目指す無限の可能性を持ったあなたを応援します。', detail:'私たちの仕事は目の前のトラックを整備するだけのように思うかもしれませんが、実は日本の物流を支えることにもつながっています。責任は重大ですが、やりがいのある仕事です。', atmosphere:'', valueTags:["team", "craft", "growth"], matchTexts:{craft:'自分の手で製品やサービスを形にする仕事', analyze:'情報を整理し筋道を立てて課題を解決する仕事', growth:'未経験からスキルアップできる環境'}, sections:[{"label": "入社後の仕事", "content": "入社後は車検という作業を行って頂きます。 3人～４人のチームで仕事を行います。普段の仕事の中で上司や先輩と一緒なので相談したりサポートをもらったり、決して孤独感はありません。"}, {"label": "求める人物像", "content": "仕事はチーム制なのでコミュニケーション力が求められます。 ただし、コミュニケーションはしゃべるだけでなく、人の話を聞いたり、積極的に学ぶことも重要です。 また、車に関心のある方をお待ちしています！"}, {"label": "成長を支援する制度", "content": "何といっても入社後1年間が大事となります。 UDトラックスではフレッシュマンリーダーという頼りになる先輩がマンツーマンで指導してくれます。 慣れない社会人生活の中での仕事は大変ですがフレッシュマンリーダーがフォローしてくれるので安心です。"}], asks:["トラックの車検って、1台にどれくらい時間がかかるんですか？", "フレッシュマンリーダーのマンツーマン指導って、1年間でどこまで覚えられますか？", "チームでの車検作業では、どんな役割分担がありますか？"], connectionText:'整備のプロフェッショナルを目指す無限の可能性を持ったあなたを応援します。' },
  { id:46, booth:'6', work:'', image:'images/46.jpg', name:'ビューテック株式会社 中津作業所', industry:'製造業', jobs:["製造職"], pr:'総勢16名のコンパクトな職場です！若い方が活躍している職場です。', detail:'今年で創業61年の老舗企業 グループ従業員1万3,400人を誇る、大手メーカーです。 主にダイハツ九州様向けの自動車ガラスに構成部品組付け＆検査 扱っている製品はsafetyガラスと呼ばれ、軽量で万が一割れても切創することのない安全なガラスです。', atmosphere:'', valueTags:["craft", "growth"], matchTexts:{team:'仲間と協力して仕事を進める環境', craft:'自分の手で製品やサービスを形にする仕事'}, sections:[{"label": "入社後の仕事", "content": "入社後、本社（愛知県）で１週間の全体研修後、中津に戻り最初の１か月間は安全・品質に重点を置いた教育を行い、 終了後に実作業の教育・訓練に移行し終了後、配置となります。"}, {"label": "求める人物像", "content": "明るく、元気で何事にもチャレンジ精神旺盛な向上心のある方。 優しく気遣いのできる方！静かに黙々と作業できる方！！も大歓迎です！！！"}, {"label": "社員に人気の福利厚生", "content": "【社会保険】健康保険、厚生年金保険、雇用保険、労災保険<br>【その他 従業員向け特典多数 】　 <br>・社員旅行（慰安旅行） 全拠点の従業員が集合して、温泉等への国内旅行。費用は全額会社負担<br>・年末年始支給品あり 年末はおせちセット・お肉・カレンダー・お餅等、年越しを迎えられる品一式。年始にはお年玉あり"}], asks:["ダイハツ九州向けの自動車ガラスって、どんな部品を組み付けるんですか？", "16名の少人数ならではの働きやすさって、どんなところにありますか？", "愛知本社での1週間の全体研修、どんな内容を学ぶんですか？"], connectionText:'総勢16名のコンパクトな職場です！若い方が活躍している職場です。' },
  { id:47, booth:'7', work:'', image:'images/47.jpg', name:'豊能運送株式会社 大分営業所', industry:'運輸・郵便業', jobs:["運転職", "製造職", "運転職"], pr:'中津市に営業所開設してもうすぐ20年。厳しくも和やかな雰囲気の職場です', detail:'ダイハツグループの物流会社で主にダイハツ九州様への自動車部品を取り扱っています。 ①運送事業：荷主様からお預かりした製品を大型トラックでお届けする<br>②倉庫事業：荷主様からお預かりした製品を倉庫で保管し、納入先の要望に応じてお届けする<br>③製品加工事業：荷主様からお預かりした部品を組み立ててお届けする。', atmosphere:'', valueTags:["team", "support"], matchTexts:{team:'仲間と協力して仕事を進める環境', stable:'安定した待遇で長く働ける環境'}, sections:[{"label": "入社後の仕事", "content": "現業職では入社直後は倉庫での仕事につき、経験と適性、本人希望により大型トラック乗務での仕事に就いて頂く場合があります。"}, {"label": "求める人物像", "content": "健康で元気、そして何事にも興味をもって積極的に取り組んでいただける方です。業務は先輩方が丁寧に指導していきます。"}, {"label": "職場の雰囲気", "content": "性別、年齢、職種は様々ですが“頼りになる物流会社”になるために助け合い、お客様にご満足をお届けしています"}], asks:["倉庫業務から大型トラック乗務に移るには、どんなステップがありますか？", "ダイハツ九州への部品納入は、1日にどれくらいの頻度で行くんですか？", "20年近く営業所があるとのことですが、長く働いている先輩が多いんですか？"], connectionText:'中津市に営業所開設してもうすぐ20年。厳しくも和やかな雰囲気の職場です' },
  { id:48, booth:'8', work:'', image:'images/48.jpg', name:'岡本土木株式会社', industry:'建設業', jobs:["技術職"], pr:'舗装・土木・港湾工事などの幅広い実績と卓越した技術力を持ち長い歴史を誇る老舗企業', detail:'創業は1917年（大正6年） 岡本土木株式会社は大分県中津市で創業。100年以上続く歴史の長い老舗企業 北九州市、中津市、福岡市に拠点を構え、社会インフラ整備に大きく貢献しております', atmosphere:'', valueTags:["team", "craft", "growth"], matchTexts:{team:'仲間と協力して仕事を進める環境', craft:'自分の手で製品やサービスを形にする仕事'}, sections:[{"label": "入社後の仕事", "content": "入社後、１ヵ月間新入社員研修を実施<br>【施工管理】 現場に配属後、先輩社員の補佐として各管理業務を行います<br>【重機オペレーター】 経験や安全意識が重視されますので、建設機械の基本操作の習得を行います"}, {"label": "成長を支援する制度", "content": "社員のスキルアップ、資格取得に会社が全力で支援。eラーニングの他、積極的なキャリアアップを支援<br>【自己啓発支援制度】<br>・資格取得費用全額補助（合格者のみ）<br>・合格祝金支給<br>・各種研修・セミナー費用の補助<br>・eラーニング制度の導入"}, {"label": "職場の雰囲気", "content": "当社は、何でも相談できる風通しの良い社風が魅力です。 日々の業務を通して土木施工に関する知識と技術を着実に身につけられるほか、資格取得を積極的に支援する制度も充実 社員の成長を会社全体でサポート"}], asks:["施工管理の1年目は、先輩の補佐として具体的に何をするんですか？", "100年以上続く会社ならではの、社風や大切にしている価値観は何ですか？", "eラーニングや研修では、どんな資格取得を目指す人が多いですか？"], connectionText:'舗装・土木・港湾工事などの幅広い実績と卓越した技術力を持ち長い歴史を誇る老舗企業' },
  { id:49, booth:'9', work:'', image:'images/49.jpg', name:'株式会社ムクノ', industry:'製造業', jobs:["事務職", "倉庫管理業", "営業職", "製造職"], pr:'珍しい職種ですが働いている方々は未経験の方ばかりですのでお気軽にお問合せ下さい', detail:'弊社は大きく３つの業務を行っております。 １．食品の原材料や、加工した食品の冷凍保管をする冷凍倉庫業 ２．地域特産を使用した加工食品の製造 ３．商品の配送、納品業務（アイスクリームなど）', atmosphere:'', valueTags:["craft", "growth"], matchTexts:{craft:'自分の手で製品やサービスを形にする仕事', stable:'安定した待遇で長く働ける環境'}, sections:[{"label": "入社後の仕事", "content": "入社後はおよそ１カ月程度、研修にて業務内容について把握していただきます。研修後は各部署の方と一緒に業務を行っていただきます。"}, {"label": "求める人物像", "content": "未経験の方でも大丈夫！業務経験がない方も多く働いています。分からない時はまわりの方が教えてくれるので、困ったときにすぐに相談してくれる方は大歓迎です。"}, {"label": "成長を支援する制度", "content": "入社後に資格が必要な部署に配属になった際は、資格の取得に必要な費用の一部を補助する制度もございます。"}], asks:["冷凍倉庫業と食品製造と配送、若手はどの部署に配属されることが多いですか？", "地域特産を使った加工食品って、具体的にどんな商品ですか？", "1ヶ月の研修では、どんなことを教えてもらえるんですか？"], connectionText:'珍しい職種ですが働いている方々は未経験の方ばかりですのでお気軽にお問合せ下さい' },
  { id:50, booth:'10', work:'', image:'images/50.jpg', name:'株式会社クラフティア（旧 九電工）', industry:'建設業', jobs:["技術職"], pr:'2025年10月、『九電工』から『クラフティア』へ社名変更しました！！', detail:'私たちは、人の暮らしを支える『社会インフラ』と『快適な環境づくり』を通して、社会に貢献しています！<br>①電気工事<br>②情報通信工事<br>③空調・衛生工事<br>④配電工事<br>⑤エネルギー事業', atmosphere:'', valueTags:["team", "craft", "growth"], matchTexts:{team:'仲間と協力して仕事を進める環境', craft:'自分の手で製品やサービスを形にする仕事', growth:'未経験からスキルアップできる環境'}, sections:[{"label": "入社後の仕事", "content": "地図に残る、やりがいのある仕事です！ <br>【電気】電気を『安心』して使えるように工事します。<br>【空調管】水と空気を『快適』に使えるように工事します。<br>【配電】発電所で作られた電気を『家庭に届ける』ために工事をします。"}, {"label": "成長を支援する制度", "content": "人財育成（研修・資格取得支援・エルダー制度）は、とても充実しています！<br>入社後は、研修施設（アカデミー）で実技訓練を通し、一から『知識』『技術』『技能』の基礎を学ぶことができます。"}, {"label": "求める人物像", "content": "『バイタリティーにあふれ、何事にもチャレンジし、プロフェッショナル志向で、最後まであきらめない人』 特に、「体力」「チームワーク力」「コミュニケーション力」を兼ね備えている方が活躍しています！"}], asks:["電気・空調管・配電の3つの中で、高卒入社で一番多い配属先はどれですか？", "アカデミーでの実技訓練は、どんな内容を何ヶ月学ぶんですか？", "「地図に残る仕事」って、具体的にどんな現場を経験できますか？"], connectionText:'2025年10月、『九電工』から『クラフティア』へ社名変更しました！！' },
  { id:51, booth:'1', work:'', image:'images/51.jpg', name:'株式会社中津レンタリース', industry:'サービス業', jobs:["接客職/事務職"], pr:'希望休100%取得可。積極的な有給取得推進。希望者の週休3日導入を行っています。', detail:'当社は創業60年を超える、地元密着のレンタカー会社です。定番の車から、バイクやキッチンカーなど、地域に求められる様々なレンタカーを取り扱っています。また、中津・宇佐・大分に拠点があり、大分県全域でサービスを提供しています。社員・お客様・地域のために、次の70年に向けて社員と共に邁進しています。', atmosphere:'', valueTags:["support", "growth", "stable"], matchTexts:{support:'人の役に立ち「ありがとう」と言われる仕事', stable:'安定した待遇で長く働ける環境'}, sections:[{"label": "求める人物像", "content": "私たちが大切にしているのは、能力やスキルではなく人柄です。実際、スタッフの大半はレンタカー業界未経験からスタートしています。人と話すのが好き。車に興味がある。細かい作業が得意。そんな方にぴったりです。"}, {"label": "職場の雰囲気", "content": "20代から40代まで、幅広い世代の社員が働いており、会話が絶えない明るい職場です。接客や車の配車、洗車など、様々な仕事を皆で分担して行うため、チームとして仕事をしていく面白さと楽しさがあります。"}, {"label": "成長を支援する制度", "content": "動画を活用した、未経験からでも学べるマニュアル学習。社員の能力に合わせて、適正な評価と昇給を行う人事評価。スキルアップを支援するための、積極的な社内外の研修プログラム。一歩ずつ学び、成長を重ねながら、新しい可能性を広げていく共育の仕組みを作っています。"}], asks:["希望者の週休3日って、実際にどれくらいの社員が利用していますか？", "レンタカー未経験から入った先輩は、何ヶ月で接客できるようになりますか？", "バイクやキッチンカーのレンタルって、どんなお客さんが借りに来るんですか？"], connectionText:'希望休100%取得可。積極的な有給取得推進。希望者の週休3日導入を行っています。' },
  { id:52, booth:'2', work:'', image:'images/52.jpg', name:'伸和建設株式会社', industry:'建設業', jobs:["技術職"], pr:'女性技術者3名が活躍中！多様な力で地域の未来を支えます！', detail:'伸和建設株式会社は、地域に密着した総合建設業として、仕事と家庭を無理なく両立できる職場環境づくりに力を入れています。 時間外労働の削減や有給休暇の取得を進めるとともに、職員のための企業主導型保育園を整備し、子育て中の社員を支援。多様な働き方を尊重する企業です。', atmosphere:'', valueTags:["team", "support", "craft"], matchTexts:{team:'仲間と協力して仕事を進める環境', support:'人の役に立ち「ありがとう」と言われる仕事', craft:'自分の手で製品やサービスを形にする仕事'}, sections:[{"label": "成長を支援する制度", "content": "社員の資格取得にも積極的にバックアップをしており、スキルアップの為の講習会や研修会にも積極的に参加しています。<br>試験前には自習室の開放など行っています。業務についても初心者でも丁寧に指導しますので安心してください。"}, {"label": "職場の雰囲気", "content": "伸和建設株式会社では、年に一度、社員全員で旅行に出かけています。日頃の労をねぎらうとともに、部署や世代を越えた交流を深めることで、チームワークの向上と働きやすい職場づくりにつなげています。<br>また、グループ企業との交流も盛んで、会社の庭でBBQを行うなど、人と人とのつながりを大切にする風土があります。"}, {"label": "今後の展望", "content": "伸和建設株式会社では、女性技術者が現場の第一線で活躍しています。<br>企業主導型保育園の整備や有給休暇の取得促進など、子育てと仕事を両立できる環境を整え、ライフステージに応じた働き方を支援。家庭を大切にしながら、技術者として輝ける職場です。"}], asks:["未経験から始めた先輩は、最初どんな現場を経験しましたか？", "年に一度の社員旅行では、どんなところに行きますか？", "建設業未経験でも現場で活躍できるようになるまで、どんな指導がありますか？"], connectionText:'女性技術者3名が活躍中！多様な力で地域の未来を支えます！' },
  { id:53, booth:'3', work:'', image:'images/53.jpg', name:'株式会社 中津急行', industry:'運輸・郵便業', jobs:["営業職", "倉庫作業員", "事務職"], pr:'安全・確実・迅速をモットーに、社員みんなが楽しく働ける会社です。', detail:'1950年創立の中津急行は、貸切輸送・小荷物輸送といった運送業を行う会社です。本社の他に10を超える数の拠点を展開しています。倉庫も多数保有しており保管～出荷・配送といったトータル物流の提案・提供を行っています。', atmosphere:'', valueTags:["team", "support"], matchTexts:{team:'仲間と協力して仕事を進める環境', support:'人の役に立ち「ありがとう」と言われる仕事'}, sections:[{"label": "職場の雰囲気", "content": "従業員同士の仲が良く、普段は楽しく緩い雰囲気で仕事をしています。 しかし、安全に対しては厳しく考えており、絶対無事故を目指して、 メリハリのある仕事を心がけています。"}, {"label": "求める人物像", "content": "運転手も事務員も、お客様とのコミュニケーションをとる機会が多いです。 一番重要視しているのは、何よりも「挨拶ができる人」というところです。 また、弊社は地域密着型企業で、中津市と一緒に様々な事業に取り組む こともあります。地元愛に溢れた方に来てもらえるとより嬉しいです。"}, {"label": "社員に人気の福利厚生", "content": "毎年社員同士で食事会などを行うと、会社から助成金が支給されます。 社員同士のコミュニケーションの場となり、みなで楽しむことができます。 他にも演劇鑑賞といった趣味にも一部助成金が支給されます。"}], asks:["貸切輸送と小荷物輸送、高卒の新入社員はどちらから始めますか？", "安全への厳しさって、具体的にどんなルールや取り組みがありますか？", "運送の仕事で、運転手と事務員はどんなふうに連携していますか？"], connectionText:'安全・確実・迅速をモットーに、社員みんなが 楽しく働ける会社です。' },
  { id:54, booth:'4', work:'', image:'images/54.jpg', name:'社会福祉法人泰然会', industry:'医療・福祉業', jobs:["介護職"], pr:'入居者様の笑顔になる時間は職員も笑顔になる時間を実感してみませんか？', detail:'地域密着型で29名定員の特別養護老人ホームです。 小規模だからこそ入居者様1人1人の思いを大切にでき そこで働く職員の生活も大切にすることを目標にしています。', atmosphere:'', valueTags:["support", "team"], matchTexts:{support:'人の役に立ち「ありがとう」と言われる仕事', stable:'安定した待遇で長く働ける環境'}, sections:[{"label": "職場の雰囲気", "content": "暖かい日は、施設の周囲を車いす散歩や運動をしてリラックスします。 職員同士の声かけや入居者様との交流を大切にしながら、穏やかで安心できる雰囲気づくりを心がけています。季節を感じる時間も楽しんでいます。<br>入居者様、ご家族様、地域の方と一緒に小さな花火大会で楽しみます。 笑顔あふれる温かな職場で、入居者様やご家族様、地域の方と心を通わせながら、思い出に残るひとときを大切にしています。"}, {"label": "社員に人気の福利厚生", "content": "ＢＢＱ　お楽しみ抽選会もあります。 職員互助会では、グループ企業合同での新年会、ボウリング大会やバーベキュー大会など開催し、職員間のコミュニケーションを図っています。"}], asks:["29名定員の小規模施設ならではの、入居者との関わり方の特徴は何ですか？", "介護未経験の高卒新人は、何から仕事を覚えていくんですか？", "入居者さん一人ひとりの思いを大切にするために、日々どんな工夫をしていますか？"], connectionText:'入居者様の笑顔になる時間は職員も笑顔になる時間を実感してみませんか？' },
  { id:55, booth:'5', work:'', image:'images/55.jpg', name:'中津コスモス電機株式会社', industry:'製造業', jobs:["技術職", "事務職"], pr:'弊社は創業42年になる電子部品製造会社です。 可変抵抗器、自動車電装品の製造。', detail:'電子部品の組立・検査及び生産工程の管理業務を行います。 生産ラインのオペレーターとして、組立業務・部材補充など生産ラインの管理や ラインの軽微なトラブル対応や復旧作業を行います。', atmosphere:'', valueTags:["craft", "growth"], matchTexts:{craft:'自分の手で製品やサービスを形にする仕事', stable:'安定した待遇で長く働ける環境'}, sections:[{"label": "入社後の仕事", "content": "生産部では、可変抵抗器（ポテンショントリマー）の製造。 技術系では、設備の保全、改善、設計など。"}, {"label": "求める人物像", "content": "自分を高める意欲があり、何事にも積極的チャレンジしていく気持ちのある人。 他の社員と協力して業務や改善などをしていく向上心のある人。"}, {"label": "成長を支援する制度", "content": "仕事に必要なスキルを取得するための研修制度・通信教育・資格取得支援など。"}], asks:["可変抵抗器って、どんな自動車の電装品に使われているんですか？", "生産ラインのトラブル対応って、どんなケースが多いんですか？", "生産部から技術系に移ることもできるんですか？"], connectionText:'弊社は創業42年になる電子部品製造会社です。 可変抵抗器、自動車電装品の製造。' },
  { id:56, booth:'6', work:'', image:'images/56.jpg', name:'九州ケース株式会社', industry:'製造業', jobs:["製造職", "営業職"], pr:'地域密着でコストと品質を両立する信頼を築く<br>段ボール会社。', detail:'ネットショッピングなどの影響により、大幅な需要増が続く段ボール。 それは人々の生活を支える「社会の基礎」の一部とも言えます。 そんな普段意識せずに接している段ボールを、 私たちは高品質、そして迅速に提供できるように 日々誇りを持って仕事に取り組んでいます。', atmosphere:'', valueTags:["team", "craft", "stable"], matchTexts:{team:'仲間と協力して仕事を進める環境', craft:'自分の手で製品やサービスを形にする仕事'}, sections:[{"label": "入社後の仕事", "content": "〇「段シート」の製造:原紙セッティング・検査等<br>段原紙 (1t程度)を転がして機械にセットする 　　原紙は工程近くまでリフトを使用<br>〇「段ボールケース」の製造 :セッティング・検査・インクの補充等<br>段ボールに印刷する為の版 　　のセッティング及びインクの補充 段ボールシートを機械にセットする"}, {"label": "社員に人気の福利厚生", "content": "・基本週休2日 (2025年度の実績で年間休日が120日)<br>・必要な資格の費用のサポートも実施しております。<br>・昼食補助もあります。"}, {"label": "求める人物像", "content": "段ボールの製造は複数工程に分かれており、各工程の協力が大事なので、 チームワークとコミュニケーション重視する方"}], asks:["段ボールを作る仕事で、体を使う作業はどれくらいありますか？", "ネット通販で需要が増えている段ボール、扱う量は年々増えていますか？", "どんな資格を取ると仕事に役立ちますか？"], connectionText:'地域密着でコストと品質を両立する信頼を築く<br>段ボール会社。' },
